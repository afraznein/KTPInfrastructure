# Shadow profile targeting roughly a 10% positional share in the current
# five-match bot corpus. This is the default for local accumulation reports,
# but it is not a production KTPR scoring profile.

[profile]
name = "accumulation_v2_target10"
status = "provisional_shadow_default"

[events]
kill = 100.0
assist = 50.0
damage = 0.10
capture_credit = 100.0
cap_break = 100.0
team_kill = -100.0
suicide = -50.0

[position]
sample_seconds = 5.0
objective_radius_units = 512.0
points_per_second_at_flag = 0.50
grid_size_units = 256
max_points_per_half = 150.0

[scenarios]
own_first_multiplier = 0.50
own_second_multiplier = 0.80
middle_multiplier = 1.25
enemy_second_multiplier = 1.75
enemy_first_multiplier = 2.25
double_cap_multiplier = 1.25
high_contest_area_multiplier = 1.20
active_contest_radius_units = 768.0
active_contest_multiplier = 1.75
last_flag_defense_kill_points = 30.0
last_flag_defense_max_per_half = 60.0
