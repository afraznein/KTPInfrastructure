; ==========================================
; PRACTICE / AIM MAPS
; ==========================================
; Not league map-pool maps. Reachable via .changemap so players can warm up.
;
; No `config =` on purpose. That key is the MATCH config KTPMatchHandler execs on
; .rdy, and a practice map has no match. Its settings come from the map-start
; config at configs/maps/<mapname>.cfg, which KTPAMXX execs 6.1s into every map --
; after dodserver.cfg, so it is the only hook that can override the competitive
; pins. Adding a `config =` here that points at a file we do not ship would just
; log "couldn't exec" on .rdy.
;
; `type` is documentary; no plugin reads it.

[dod_pandemic_aim]
name = Pandemic (Aim)
type = practice

[dod_orange]
name = Orange (Aim)
type = practice
