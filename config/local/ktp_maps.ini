; KTPMatchHandler / KTPAdminAudit map list config
; Profile: Local Development
;
; OWNER: afraznein/KTPDoDServerConfig, at
;   serverfiles/dod/addons/ktpamx/configs/ktp_maps.ini
; That is the file the fleet loads and the only one worth editing to change what
; a server does. This one is bound into the Docker dev stack by
; docker-compose.local.yml and is the default input of scripts/spatial_map_registry.py,
; so it is loaded -- but only ever by the dev stack.
;
; Everything below this header is a copy of the owner's file, taken 2026-10-09 when
; all 24 instances carried that file byte for byte. It is NOT a mirror: nothing keeps
; it in sync, so re-copy from the owner rather than editing sections here. The owner's
; file is CRLF and this one is LF, so compare them with CR stripped.
; Every `config =` must name a file in config/local/dod-configs/, which the dev stack
; mounts as dod/configs; a missing one is a silent no-op exec and clan mode never arms.

; ==========================================
; KTP Match Handler - Map Configuration
; ==========================================
;
; New section-based format (v0.4.0+)
; Each map has its own [section] with config, name, and type
;
; Format:
; [map_name_without_bsp]
; config = config_file.cfg
; name = Display Name
; type = competitive
;
; ==========================================
; SEASONAL MAPS (S10, in schedule order)
; .changemap lists maps in this file's order, 7 per page.
; ==========================================

