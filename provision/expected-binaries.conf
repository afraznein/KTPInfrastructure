# KTP Fleet — Expected binary md5s (source of truth)
#
# Used by scripts/audit-fleet-drift.py to detect drift between the live fleet
# state and what the repo says each host SHOULD have. Values are the first
# 16 chars of md5sum output (matches the fleet-drift-snapshot.sh format).
#
# Update after each successful fleet deployment. Canary instances will flag
# as drift until the fleet-wide promotion completes — that's expected and
# informative. `scripts/ktp-wave-ledger.py reconcile` fails while a pin here
# lags the fleet, and `ktp-wave-ledger.py repin-expected --write` rewrites it.
#
# Format: one `relative/path = md5prefix16` per line. Paths are relative to
# each host's ~/dod-27015/serverfiles/ (the audit checks port 27015). `#`
# starts a comment; [section] headers scope expected values by host group.
#
# [default] applies to all hosts unless a [baremetal] / [vps] section
# overrides. Group overrides are useful if the VPS runs a different subset
# of modules — currently all KTP binaries should be identical fleet-wide.

[default]

# ============================================================================
# Current production baseline (engine 3.22.0.1110-dev from wave
# 20261110T153319Z / dodx 2.7.33.6029 from wave 20261109T033915Z / core
# 2.7.33.6031 from wave 20261110T183744Z, activating at the 03:00 ET swap on
# 2026-11-11; reapi .368 and amxxcurl unchanged since the 2026-08-26 ABI wave)
#
# The label on each entry is a convenience. IDENTITY IS THE MD5 — re-derive
# against a live pull before trusting any version string in this file.
# ============================================================================
#
# Re-pinned 2026-11-10 against all 24 instances: engine, dodx, hlds_linux,
# libsteam_api, reapi and amxxcurl each read one md5 on 24/24, a nonsense-path
# control was missing on 24/24. The core line pins the build staged as
# ktpamx_i386.so.new on 24/24, not the one running at the time of the re-pin;
# it is correct only once that swap has activated.
#
# Re-pinned 2026-10-28 against all 24 instances (not just port 27015): every
# entry below returned one md5 on 24/24, with a nonsense-path control failing
# on every host so an unreadable file could not read as agreement. The engine
# and dodx lines moved; the other five were measured identical, not assumed.
#
# The 2026-10-01 pin lagged four engine waves and three dodx waves, so the
# audit reported the same 10 items every Monday (2 binaries x the 5 sampled
# hosts) and re-reported them as NEW on each activation, because the drift
# state key includes the hash.
#
# A baseline that lags the fleet reports permanent, unresolvable drift, which
# is how operators learn to ignore this audit — the 2026-05-11 baseline did
# exactly that once already.

