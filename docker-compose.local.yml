# KTP Local Development Environment
#
# Runs the full KTP stack locally — game servers + data server — mirroring
# production topology in a single compose project.
#
# All services share one Docker network so containers resolve each other
# by service name (ktp-game-1, ktp-game-2, data) via Docker DNS.
#
# Prerequisites:
#   make build                      # compile all KTP components
#   make extract-artifacts          # extract to artifacts/VERSION/
#   make local-build                # build runtime + data server images
#
# Usage:
#   make local-up                   # start all services
#   make local-down                 # stop
#   make local-logs                 # tail logs
#   docker compose -f docker-compose.local.yml logs -f data   # data server only
#
# Adding custom plugins (e.g., HUD Observer):
#   Drop .amxx files in local/plugins/ — copied into KTPAMXX plugins dir at startup.
#   (ktp-game-2 reads local/plugins-bots/ instead — see below.)
#
# ⚠ THE TWO GAME SERVERS ARE NOT THE SAME STACK:
#
#   ktp-game-1  production topology — extension mode, no Metamod, no bots.
#               The control. Use it to confirm anything found on game-2.
#   ktp-game-2  BOT SERVER. Metamod-R hosts new_bot, and ktpamx is a
#               KTP_LANE_B_FAKECLIENTS build stamped NOT FOR PRODUCTION.
#               `fakemeta` is reachable here and is NOT reachable on the
#               fleet, so a fakemeta-dependent regression passes here and
#               fails on all 25 servers.
#
#   Bots need a one-off ~10 min build: make local-bots-amxx
#   Then:                              make local-bots-up && make local-bots-match
#
# Environment variables:
#   VERSION            - Artifact version to use (default: latest)
#   KTP_PROJECT_ROOT   - Path to parent Git directory (default: ..)

services:
  # ============================================================
  # Game Server 1 — dod_anzio
  # ============================================================
  ktp-game-1:
    build:
      context: .
      dockerfile: runtime/Dockerfile
      args:
        VERSION: ${VERSION:-latest}
    image: ktp-gameserver:${VERSION:-latest}
    # depends_on removed — game servers boot fine without the data service.
    # The HUD ingest URL resolves to a stub when data is absent; no runtime error.
    # Bring up the data service alongside game servers with `--profile full`.
    environment:
      MAP: dod_anzio
      MAXPLAYERS: "13"
      RCON_PASSWORD: "${RCON_PASSWORD:-changeme}"
      SERVER_HOSTNAME: "KTP Local Dev #1"
    tty: true
    stdin_open: true
    entrypoint: ["bash", "/entrypoint.sh"]
    command: ["-console", "-norestart"]
    volumes:
      - ./config/local:/config:ro
      - ./local/plugins:/plugins:ro
      # Prod-mirrored match-time map configs (configs/ktp_<map>.cfg -> ktpbasic.cfg).
      # Without these, KTPMatchHandler's exec_map_config misses, mp_clan_match is
      # never armed, and the engine silently ignores mp_clan_restartround at
      # go-live (no countdown, no round restart, no half-timer rebase).
      - ./config/local/dod-configs:/opt/hlds/dod/configs:ro
    ports:
      - "27016:27015/udp"
      - "27016:27015/tcp"
      - "26900:26900/udp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f hlds_linux > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================
  # Game Server 2 — BOT SERVER, NOT PRODUCTION TOPOLOGY
  # ============================================================
  #
  # Unlike ktp-game-1, this server runs Metamod-R (hosting new_bot) and a
  # ktpamx built with KTP_LANE_B_FAKECLIENTS — a binary stamped NOT FOR
  # PRODUCTION, because in extension mode AMXX otherwise cannot see bots at
  # all. See build/bots/Dockerfile for the full topology and why.
  #
  # ktp-game-1 is deliberately left alone as the control: it is the only way
  # to tell "broken in extension mode" from "broken under Metamod". Under
  # Metamod `fakemeta` becomes reachable, so a fakemeta-dependent regression
  # passes here and fails on all 25 fleet servers.
  #
  # Drive a real 6v6 through go-live with:
  #   make local-bots-match
  #
  ktp-game-2:
    build:
      context: .
      dockerfile: build/bots/Dockerfile
      args:
        VERSION: ${VERSION:-latest}
    image: ktp-gameserver-bots:${VERSION:-latest}
    # depends_on removed — see ktp-game-1. Use `--profile full` to include data.
    environment:
      # anzio is the map upstream validated bot runs on. Override with BOT_MAP,
      # but CHECK WAYPOINTS FIRST — new_bot 0.2.2 ships 94 .wpt files and they
      # cover stock maps only. Verified in the image: anzio, flash, donner,
      # kalt, avalanche, merderet and jagd have waypoints; the S10 custom pool
      # (saints2_b3e, railyard_s9d, armory_b6, halle, thunder2, lennon5_b1,
      # railroad2_s9a) has NONE. An unwaypointed map gives bots that connect
      # and then stand still, which reads as "the pipeline is broken".
      #   docker run --rm --entrypoint bash ktp-gameserver-bots:$VERSION \
      #     -c 'ls /opt/hlds/dod/new_bot/waypoints'
      MAP: ${BOT_MAP:-dod_anzio}
      # 12 bots + HLTV + a spectator slot. The production 13 does not fit a
      # full 6v6 plus anyone watching.
      MAXPLAYERS: "16"
      RCON_PASSWORD: "${RCON_PASSWORD:-changeme}"
      # Surfaced verbatim on /watch and /hq, so the overlay says so too.
      SERVER_HOSTNAME: "KTP LOCAL BOTS #2 [NON-PROD metamod+patched-amxx]"
    tty: true
    stdin_open: true
    entrypoint: ["bash", "/entrypoint-bots.sh"]
    # Metamod must be told which real game DLL to load underneath: liblist.gam
    # now points at Metamod itself, so reading it would be circular.
    command: ["-console", "-norestart", "+localinfo", "mm_gamedll", "dlls/dod.so"]
    volumes:
      - ./config/local:/config:ro
      # NOT ./local/plugins — entrypoint.sh copies /plugins/*.amxx over the
      # image's, so a KTP_TEST_MODE KTPMatchHandler in the shared directory
      # would leak onto ktp-game-1 and quietly change the control server.
      - ./local/plugins-bots:/plugins:ro
      # KTP_LANE_B_FAKECLIENTS ktpamx + matching dodx. Mounted to a side path
      # and copied into place by the entrypoint, which REFUSES TO BOOT if it
      # is absent — a bot-blind server is silent and looks healthy.
      - ./local/lane-b:/opt/ktp-laneb:ro
      - ./config/local/dod-configs:/opt/hlds/dod/configs:ro
    ports:
      - "27017:27015/udp"
      - "27017:27015/tcp"
      - "26901:26900/udp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f hlds_linux > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ============================================================
  # Data Server — MySQL, HLTV proxies, HLStatsX stub,
  #               HUD Observer backend + frontend (supervisord)
  # ============================================================
  # Behind the `full` profile so the standard `make local-up` works without
  # needing the sibling DoD-hud-observer checkout. Opt in with:
  #   DOD_HUD_PATH=../DoD-hud-observer make local-up-full
  # or:
  #   docker compose -f docker-compose.local.yml --profile full up -d
  data:
    profiles: ["full"]
    build:
      # Context is DoD-hud-observer — its .dockerignore excludes node_modules/.git.
      # Dockerfile lives there too, with COPY paths relative to its own root.
      context: ${DOD_HUD_PATH:-../DoD-hud-observer}
      dockerfile: data-server/Dockerfile
    image: ktp-dataserver:${VERSION:-latest}
    environment:
      # Tell the backend to read the bind-mounted config below instead of the
      # one COPY'd into the image at build time. Mirrors how production sets
      # HUD_CONFIG_PATH on the systemd unit. Without this override the backend
      # resolves config relative to its own __dirname and reads
      # /app/config/local/config.yaml (the image-baked default), so the bind
      # mount would be a no-op.
      HUD_CONFIG_PATH: /app/config.yaml
    volumes:
      # Backend config (auth key, ports, storage, hltv_sync). Source of truth
      # for the local docker stack — edit this file, restart the data container.
      - ./config/local/config.yaml:/app/config.yaml:ro
      # mkcert cert for the nginx :443 single-origin proxy (locally trusted),
      # read-only. Lives in the DoD-hud-observer checkout (gitignored,
      # machine-specific); start.sh copies it into the writable cert dir nginx
      # reads, or self-signs a fallback if empty. See that repo's deploy/README.md
      # → Friendly URL for the mkcert + hosts-file steps.
      - ${DOD_HUD_PATH:-../DoD-hud-observer}/data-server/certs:/etc/nginx/certs-src:ro
      # HLTV proxy configs — staged at /host-cfgs and copied into the instance
      # dirs by start.sh. Mounting them directly at /opt/hltv/instance-N/hltv.cfg
      # breaks the 32-bit HLTV binary's stat() on Docker Desktop / WSL2 because
      # the bind-mount synthesizes 64-bit inodes that overflow stat32 (EOVERFLOW),
      # the cfg silently falls back to default port 27020, and both instances
      # race for the same port.
      - ./test-env/data/hltv-1.cfg:/host-cfgs/hltv-1.cfg:ro
      - ./test-env/data/hltv-2.cfg:/host-cfgs/hltv-2.cfg:ro
      # HLTV demo recordings (persist across restarts)
      - ./test-env/data/demos:/opt/hltv/demos
      # MySQL data (persist across restarts)
      - ktp-mysql-data:/var/lib/mysql
    ports:
      # nginx single-origin reverse proxy — overlay + REST + Socket.IO all served
      # from https://localhost (:443, with :80 redirect, no hosts file needed);
      # use this as the OBS / browser entry point. Same nginx setup runs prod at
      # https://hud.ktpdod.com. Raw ports below stay published for direct debug,
      # and config/local/config.yaml lists BOTH origins so Socket.IO's
      # credentials CORS accepts either entry point.
      #
      # These are the first privileged/common ports this stack has needed, and
      # they are frequently already held on a dev box (IIS, another compose
      # stack). A bind collision fails the whole `data` service, so the symptom
      # is "the stack won't come up" rather than "the proxy didn't start" —
      # check `netstat -ano | findstr :443` before blaming the HUD.
      - "443:443"
      - "80:80"
      # Frontend (OBS browser source, direct)
      - "3000:3000"
      # Backend REST API (direct)
      - "3001:3001"
      # Socket.IO (direct)
      - "4000:4000"
      # HTTP ingest from AMXX plugin (NOT proxied — direct IP-restricted POST)
      - "8088:8088"
      # HLTV proxies
      - "27020:27020/udp"
      - "27021:27021/udp"
      # HLStatsX log receiver
      - "27500:27500/udp"
      # MySQL (for debugging)
      - "3306:3306"

volumes:
  ktp-mysql-data:
