####################################################################
# KTPR WEIGHTS  --  edit this file as discussions evolve.
#
# Nothing in the engine is hard-coded; every knob lives here.
# Each [profiles.X] block is a self-contained KTPR definition.
#   - old      : the original Excel formula (frozen, do not edit).
#   - current  : the newer Excel formula (frozen, do not edit).
#   - new      : the clean-redesign we are actively tuning. EDIT THIS.
#
# After editing, run:  python ktpr_engine.py --profile new
# and compare rankings. Changes here never require touching code.
####################################################################


# =========================== FROZEN =============================
# The two Excel formulas, kept for comparison. Leave these alone.

[profiles.old]
scale             = 0.80   # final multiplier
kd_cap            = 1.10   # K/D is capped here before use
flag_w_regular    = 0.50   # relative-flag weight for regular players
flag_w_nonregular = 0.30   # relative-flag weight for non-regulars
flag_cap          = 0.40   # ceiling on total flag bonus
flag_log_base     = 25.0   # LOG(flags+1)/LOG(base) diminishing term
death_w           = 0.20   # death penalty weight
death_cap         = 0.15   # ceiling on death penalty
part_floor        = 0.00   # floor on participation threshold
guard_zero_median = false  # newer formula added divide-by-zero guards

[profiles.current]
scale             = 0.75
kd_cap            = 1.10
flag_w_regular    = 0.30
flag_w_nonregular = 0.20
flag_cap          = 0.35
flag_log_base     = 25.0
death_w           = 0.20
death_cap         = 0.15
part_floor        = 0.34
guard_zero_median = true


# ==================== DATAPOINT: artifact =======================
# The additive formula someone else started (per-half, mean-normalized):
#   KTPR = [ (K/D / avg) + (kills/half / avg) + 0.25*(flags/half / avg) ] / 2.25
# A different shape from the Excel formulas — kept as a comparison datapoint.
# Add assists/damage/breaks weights here to explore an additive redesign.

[profiles.artifact]
formula                = "additive"
norm                   = "mean"
additive_regulars_only = false
add_kd     = 1.00
add_kills  = 1.00
add_flags  = 0.25
add_assists = 0.00
add_damage  = 0.00
add_breaks  = 0.00


