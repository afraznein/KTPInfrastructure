# Installed as /etc/needrestart/conf.d/50-ktp-no-auto-restart.conf on the data server (Perl, eval'd by needrestart.conf).
# Ubuntu's APT hook restarts outdated daemons automatically, so an unattended upgrade could bounce these mid-match.
# Upgrades still land; restart these by hand outside match time. `needrestart -r l -m a` lists them as deferred.
$nrconf{override_rc}->{qr(^ktp-ac-api\.service$)} = 0;
$nrconf{override_rc}->{qr(^nginx\.service$)} = 0;
$nrconf{override_rc}->{qr(^hltv@.*\.service$)} = 0;
$nrconf{override_rc}->{qr(^hlstatsx\.service$)} = 0;
$nrconf{override_rc}->{qr(^ktp-admin-bot\.service$)} = 0;
