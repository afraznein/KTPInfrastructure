# Without a cap journald defaults to 10% of / (tens of GB on this box), so it is bounded explicitly.
# Sized for about ten days at the hlstatsx daemon's measured write rate; the rate drifts, so re-measure
# (journalctl --disk-usage, and the oldest entry from journalctl -o short-iso | head -1) before trusting the window.
[Journal]
SystemMaxUse=8G
SystemKeepFree=2G
