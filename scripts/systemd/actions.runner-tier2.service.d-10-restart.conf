# Drop-in for the tier-2 runner unit, installed on the data server at
#   /etc/systemd/system/actions.runner.<name>.service.d/10-restart.conf
#
# The runner exits 0 when it fails to create a session, so Restart=on-failure is
# inert here -- only Restart=always retries. The same setting covers the runner's
# self-update, which also exits 0 and expects the manager to bring it back.
#
# A stale server-side session from an unclean shutdown is rejected for ~a minute
# after boot, so the retry has to outlive that; StartLimitIntervalSec=0 removes the
# give-up, because giving up returns the runner to being silently offline -- which
# reads as "no jobs queued", not as a failure.
#
# Drop-in, not an edit: the runner's own svc.sh regenerates the unit on upgrade.

[Unit]
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=30
