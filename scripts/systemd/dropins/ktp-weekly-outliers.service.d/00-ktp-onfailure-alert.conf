[Unit]
# Added 2026-08-15. This unit's body already CLAIMED this wiring in a comment
# while the directive was absent, so `grep OnFailure` on it read as wired and
# its failures reached nobody. Verify with `systemctl show -p OnFailure`,
# never a grep of the unit file.
# Posts a red Discord embed via /usr/local/bin/ktp-systemd-alert on failure.
# Companion to ktp-data-server-health.sh, the periodic safety net.
OnFailure=ktp-systemd-alert@%n.service
