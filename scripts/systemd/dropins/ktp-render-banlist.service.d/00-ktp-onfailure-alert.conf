[Unit]
# Posts a red Discord embed via /usr/local/bin/ktp-systemd-alert when this unit
# fails. Companion to ktp-data-server-health.sh, the periodic safety net.
#
# This is a 60-SECOND timer, so it is the one consumer that needs the alert
# script's per-unit cooldown -- without it a sustained outage posts 60 embeds an
# hour. Do NOT throttle with StartLimitBurst instead: on a timer-triggered unit
# that leaves it failed and refuses further starts until reset-failed, silently
# wedging the renderer.
OnFailure=ktp-systemd-alert@%n.service
