# KTP secret scan — value-based gate on every PR and push.
#
# ⚠️ NO `paths:` FILTER, deliberately. Every other workflow here narrows its
# triggers so unrelated refactors don't pay the round-trip. This one must not:
# a path filter turns the gate into a check that silently passes on exactly the
# commit that introduced a secret somewhere nobody predicted. The run is seconds.
#
# ⚠️ FORK PRs GET NO SECRETS. GitHub withholds repository secrets from
# pull_request runs originating in a fork, so the value scan there loads no
# inventory and reports BROKEN (exit 2) rather than a false green. That is the
# intended behaviour: a maintainer re-runs it from a branch on this repo. Do not
# "fix" it by moving to pull_request_target, which would hand a fork's code the
# inventory.
#
# What GitHub's own scanning does NOT cover, and why this exists: secret scanning
# and push protection are both enabled on this repo and both let a 10-character
# data-server root password through, because they only match registered provider
# formats. Generic credentials need the value list.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main, preprod]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate pickaxes a commit RANGE, so it needs the history the range
          # spans. A shallow clone would scan nothing and call it clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-test (must pass before any result is trusted)
        run: python scripts/ktp_secret_scan.py selftest

      - name: Audit .gitignore credential tags
        # Structure only: ignored files are untracked by definition, so a CI
        # checkout holds none of them. The content half runs on the operator box.
        run: python scripts/ktp_secret_scan.py audit-ignore --structure-only

      - name: Write inventory from repository secret
        env:
          KTP_SECRET_INVENTORY_CONTENT: ${{ secrets.KTP_SECRET_INVENTORY }}
        run: |
          if [ -z "${KTP_SECRET_INVENTORY_CONTENT}" ]; then
            echo "::error::KTP_SECRET_INVENTORY is empty. On a fork PR this is"
            echo "::error::expected — re-run from a branch on this repository."
            echo "::error::Otherwise the repository secret is missing; a scan"
            echo "::error::without an inventory proves nothing."
            exit 2
          fi
          umask 077
          printf '%s' "${KTP_SECRET_INVENTORY_CONTENT}" > "${RUNNER_TEMP}/inv.txt"

      - name: Scan the pushed range
        env:
          KTP_SECRET_INVENTORY: ${{ runner.temp }}/inv.txt
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            RANGE="origin/${GITHUB_BASE_REF}...HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          echo "scanning range: ${RANGE}"
          python scripts/ktp_secret_scan.py range --range "${RANGE}" --include-retired

      - name: Scan the tracked tree
        env:
          KTP_SECRET_INVENTORY: ${{ runner.temp }}/inv.txt
        run: python scripts/ktp_secret_scan.py tree --include-retired

      - name: Shred the inventory
        if: always()
        run: rm -f "${RUNNER_TEMP}/inv.txt"
