# KTP Tier 1 — lan-web pure-function gate
#
# sites/lan-web/tests/ existed for months and was run by NOTHING. The cost was
# concrete: on 2026-08-02 the group-stage head-to-head tiebreak was found dead
# mid-event with a test sitting right there that claimed to cover it — and that
# test passed, because its fixture never produced the tie it asserted on, so it
# was decided on win count alone. Nothing ran it, and nothing would have caught
# the fixture either.
#
# Installs requirements.txt, not a hand-picked subset. The suite outgrew
# "pure functions" when the route-level tests landed: conftest.py imports the
# real app, so the app's own manifest IS the test manifest and a subset here
# would drift out of sync silently. That is not hypothetical — this job ran
# `pip install pytest` alone and went red on every push for a day, collecting
# zero of 135 tests, while the site it gates was being deployed.
#
# Covers: standings tiebreak ladder, bracket slot resolution, seeding, veto
# sequence, map-skip tally, schedule, publish gate, and the JSON API routes
# (uploads, takedowns, feedback, award voting) against a fake db.

name: Tier 1 lan-web Tests

on:
  # No `paths:` filter, matching config-tests.yml: a paths-filtered required
  # check is silently skipped on unrelated PRs and leaves them un-mergeable
  # without an admin override. The job decides for itself whether to run.
  push: {}
  pull_request: {}
  workflow_dispatch:
  workflow_call:

jobs:
  lan-web-tests:
    name: lan-web pure-function tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          set -e
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "Non-PR event ${{ github.event_name }}; will run pytest."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" \
              | grep -qE '^(sites/lan-web/|\.github/workflows/lan-web-tests\.yml$)'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "lan-web files changed; will run pytest."
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::No sites/lan-web changes in this PR; skipping pytest (job still passes so the required check is satisfied)."
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == '1'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        if: steps.changes.outputs.run == '1'
        working-directory: sites/lan-web
        run: pip install -r requirements.txt pytest

      - name: Run lan-web tests
        if: steps.changes.outputs.run == '1'
        working-directory: sites/lan-web
        run: python -m pytest tests/ -v --tb=short

      # The suite is only worth having if it is actually loading tests. A
      # collection error, a renamed directory or a bad rootdir all exit 0 with
      # "no tests ran", which reads exactly like a pass in a green check.
      - name: Assert the suite is not empty
        if: steps.changes.outputs.run == '1'
        working-directory: sites/lan-web
        run: |
          set -e
          n=$(python -m pytest tests/ --collect-only -q 2>/dev/null | grep -cE '::test_')
          echo "collected $n tests"
          if [ "$n" -lt 120 ]; then
            echo "::error::Only $n tests collected (expected 120+). Tests were lost, not fixed."
            exit 1
          fi
