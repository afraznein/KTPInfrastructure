# KTP Lane B — stats-capture end-to-end (containerised, ephemeral MySQL)
#
# Two lanes: `full` = 12 bots in a synthetic 6v6; `corpus` = deterministic replay
# of committed fixture logs. They have different gating rules — see below.
#
# Runs on a GITHUB-HOSTED runner, deliberately, not the Tier 2 self-hosted one:
#
#   - The Tier 2 runner is on the data server, which also runs production
#     HLStatsX, and is deliberately Docker-free (TEST_INFRASTRUCTURE_PLAN).
#   - That box keeps a serverfiles tree that must MATCH THE LIVE FLEET, with a
#     drift tripwire and a manual-only re-sync. The SHA-pinned new_bot binary is
#     built only into this job's disposable image, never into that tree.
#   - GH-hosted has Docker, has no production anything, and cannot reach the
#     fleet. publish-base-image.yml already builds this 2 GB image here and
#     smoke-callable.yml already boots the runtime container here, so the shape
#     is proven.
#
# ## What may gate a merge, and what may not — READ THE LANE, not the workflow
#
# This file has TWO lanes and they differ on exactly the property that decides
# this. Six steps are gated `LANE == 'full'` (the 12-bot 6v6 match and its
# machinery); one is gated `LANE == 'corpus'` (a replay of committed fixture
# logs through the daemon). The corpus lane never starts a bot.
#
#   `full`   — NOT a required status check, and no `pull_request` trigger. Bot
#              AI is non-deterministic; a lane that can flake must never gate a
#              merge, or the result is the "disable the integration test to
#              merge the urgent fix" antipattern TEST_INFRASTRUCTURE_PLAN
#              already warns about. Lane A (tier2-integration.yml) is the gate.
#
#   `corpus` — MAY gate. Deterministic by construction: committed fixtures, no
#              bot, no AI. It is required on KTPAMXX `main` as
#              `corpus-regression / Lane B (corpus, main, run 1)`, and it has
#              caught a real regression (a migrate_022 failure that reproduced
#              on two PRs and cleared on the fix). It also runs post-merge on
#              this repo's `main`, via lane-b-corpus-main.yml — nothing in this
#              file's own `on:` block fires on a merge, which is why that
#              caller exists rather than another trigger here.
#
# ⚠️ This paragraph used to forbid BOTH lanes from gating. It was written when
# this workflow was bots-only — the title above still says so — and the corpus
# lane was added later without updating it. The prohibition was never violated
# in substance: `full` has never been a required check.
#
# ⚠️ Green on `corpus` means "no regression against the committed fixtures", NOT
# "the stats are correct". It replays what is committed, so a bug the fixtures
# do not exercise passes cleanly — that has happened (KTP_FLAG_POSITION). Widen
# the fixtures to widen the claim; do not read the badge as more than it is.
#
#
# ## What this proves, and what it does not
#
# The image is a RECONSTRUCTION of the fleet built from repo refs — the real
# fleet is bare metal with artifacts staged as `.new` and swapped at the 03:00
# ET restart (docs/DEPLOYING.md). Green here means "this branch's code works
# against this branch's stack", which is what you want when testing a branch.
# It does NOT mean "works against what is currently deployed". That question
# still belongs to the Tier 2 runner's fleet-matching tree.
#
# The engine is the exception, and `engine_ref` is how it stops being one: it is
# baked into the base image rather than built from a ref, so without that input
# every lane measures whatever engine the last base-image build happened to
# carry. Given a ref, the KTP-ReHLDS CI artifact for that commit replaces it and
# the whole suite runs against the candidate. Empty keeps the baked engine, and
# nothing falls back — smoking the old engine under a green badge is the one
# outcome worse than not running at all.

name: Lane B Stats E2E

on:
  workflow_call:
    inputs:
      amxx_ref:
        description: KTPAMXX ref under test
        required: true
        type: string
      daemon_ref:
        description: KTPHLStatsX ref under test
        required: true
        type: string
      lane:
        description: "'corpus' or 'full'"
        required: false
        type: string
        default: corpus
      infrastructure_ref:
        description: KTPInfrastructure ref/SHA containing the reusable harness
        required: false
        type: string
        # main, not preprod: KTPInfrastructure's preprod is retired.
        default: main
      matchhandler_ref:
        description: KTPMatchHandler ref/SHA for the test-mode match driver
        required: false
        type: string
        default: main
      seccomp:
        description: >-
          Docker seccomp profile for the hlds boot container only. Empty (the
          default) is docker's default profile, i.e. today's behaviour. Set it
          to `unconfined` to test whether the sandbox is what refuses hlds's
          32-bit socket call: the boot has died with ENOSYS since 2026-10-26
          while every input under our control stayed identical.
        required: false
        type: string
        default: ''
      engine_ref:
        description: >-
          KTP-ReHLDS ref/SHA whose CI engine artifact replaces the image's baked
          engine. Empty keeps the baked engine. 'full' lane only.
        required: false
        type: string
        default: ''
      map_name:
        description: Map to run bots on
        required: false
        type: string
        default: dod_anzio
      shot_detail_types:
        description: >-
          ktp_shot_detail_types bitmask for KTPMatchHandler, as (1 << MatchType).
          -1 (default) leaves the plugin default alone (4 = 12-mans only).
        required: false
        type: string
        default: '-1'
      shot_detail:
        description: >-
          ktp_stats_shot_detail for the run. 1 (default) populates the shot
          diagnostics -- production runs them on 12-mans (bitmask 4, kept
          on by the 2026-09-18 ruling), and the lane's own match type is
          not a 12-man, so it opts in explicitly to exercise the same path;
          check_hit_registration reads them. 0 leaves them NULL and reports
          that check as not exercised.
        required: false
        type: string
        default: '1'
      play_seconds:
        description: Full-match play window (v6 schema22/2s ratings require at least 300 seconds)
        required: false
        type: string
        default: '360'
  workflow_dispatch:
    inputs:
      infrastructure_ref:
        description: 'KTPInfrastructure ref/SHA containing the Lane B harness'
        required: true
        type: string
        default: 'main'
      matchhandler_ref:
        description: 'KTPMatchHandler ref/SHA for the test-mode match driver'
        required: true
        type: string
        default: 'main'
      amxx_ref:
        description: 'KTPAMXX ref/SHA under test (e.g. feat/stats-positions)'
        required: true
        type: string
        default: 'main'
      daemon_ref:
        description: 'KTPHLStatsX ref/SHA under test (e.g. feat/seed-cap-break-action)'
        required: true
        type: string
        default: 'main'
      lane:
        description: >-
          'full' = 12 bots (6v6) + server + database + assertion suite. 'corpus' =
          deterministic committed-log replay and is the merge gate.
        required: false
        type: choice
        options: [full, corpus]
        default: full
      socket_probe:
        description: >-
          Run ONLY the 32-bit socket syscall probe and skip Lane B itself.
          Set to `true` to find out which call the sandbox refuses. A new
          workflow file cannot be dispatched until it sits on the default
          branch, which is why this lives here and not in its own file.
        required: false
        type: string
        default: ''
      seccomp:
        description: >-
          Docker seccomp profile for the hlds boot container only. Empty (the
          default) is docker's default profile, i.e. today's behaviour. Set it
          to `unconfined` to test whether the sandbox is what refuses hlds's
          32-bit socket call: the boot has died with ENOSYS since 2026-10-26
          while every input under our control stayed identical.
        required: false
        type: string
        default: ''
      engine_ref:
        description: >-
          KTP-ReHLDS ref/SHA whose CI engine artifact replaces the image's baked
          engine (e.g. main, or a commit). Empty keeps the baked engine.
        required: false
        type: string
        default: ''
      map_name:
        description: 'Map to run bots on'
        required: false
        type: string
        default: 'dod_anzio'
      shot_detail_types:
        description: >-
          ktp_shot_detail_types bitmask for KTPMatchHandler, as (1 << MatchType).
          -1 (default) leaves the plugin default alone (4 = 12-mans only).
        required: false
        type: string
        default: '-1'
      shot_detail:
        description: >-
          ktp_stats_shot_detail for the run. 1 (default) populates the shot
          diagnostics -- production runs them on 12-mans (bitmask 4, kept
          on by the 2026-09-18 ruling), and the lane's own match type is
          not a 12-man, so it opts in explicitly to exercise the same path;
          check_hit_registration reads them. 0 leaves them NULL and reports
          that check as not exercised.
        required: false
        type: string
        default: '1'
      play_seconds:
        description: 'How long to let the bots play'
        required: false
        type: string
        default: '360'
  schedule:
    # Requested after publish-base-image (04:30 UTC) so a run usually pulls a
    # fresh base, but GitHub starts scheduled runs hours late, so neither that
    # ordering nor separation from Tier 2 (09:00 UTC) is guaranteed.
    - cron: '0 6 * * *'

permissions:
  contents: read
  packages: read

concurrency:
  # One Lane B at a time per caller, event and ref -- not one repo-wide. The
  # callers all enter through `workflow_call` and inherit the caller's context,
  # so a constant key queued every nightly, push, PR and dispatch in a single
  # group, and GitHub drops the PENDING run when the next arrival lands.
  # ⚠️ A cancelled run still looks absent: confirm `in_progress`, not existence.
  group: lane-b-stats-e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane-b:
    if: ${{ inputs.socket_probe != 'true' }}
    name: Lane B (${{ inputs.lane || 'full' }}, ${{ matrix.target_ref }}, run ${{ matrix.run_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 5
      # Scheduled runs test main, the production line. Called/manual runs
      # retain their requested infrastructure ref.
      matrix:
        target_ref: ${{ github.event_name == 'schedule' && fromJSON('["main"]') || inputs.infrastructure_ref != '' && fromJSON(format('["{0}"]', inputs.infrastructure_ref)) || fromJSON(format('["{0}"]', github.ref_name)) }}
        # Part of the artifact name, so upload-artifact v4 never collides.
        run_index: [1]

    env:
      # The harness is NOT part of what a run is testing, so it does not follow
      # matrix.target_ref; target_ref drives only the three COMPONENT refs below.
      INFRASTRUCTURE_REF: ${{ inputs.infrastructure_ref || 'main' }}
      MATCHHANDLER_REF: ${{ inputs.matchhandler_ref || matrix.target_ref }}
      AMXX_REF: ${{ inputs.amxx_ref || matrix.target_ref }}
      DAEMON_REF: ${{ inputs.daemon_ref || matrix.target_ref }}
      LANE: ${{ inputs.lane || 'full' }}
      # No matrix fallback: an unset engine_ref must mean the baked engine, and
      # defaulting it to the infrastructure ref would silently inject on every
      # scheduled run.
      ENGINE_REF: ${{ inputs.engine_ref || '' }}
      LANE_B_SECCOMP: ${{ inputs.seccomp || '' }}
      ENGINE_REPO: ${{ github.repository_owner }}/KTP-ReHLDS
      MAP_NAME: ${{ inputs.map_name || 'dod_anzio' }}
      PLAY_SECONDS: ${{ inputs.play_seconds || '360' }}
      SHOT_DETAIL: ${{ inputs.shot_detail || '1' }}
      SHOT_DETAIL_TYPES: ${{ inputs.shot_detail_types || '-1' }}
      BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/ktp-runtime-test-base:latest

    steps:
      - name: Checkout KTPInfrastructure
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPInfrastructure
          ref: ${{ env.INFRASTRUCTURE_REF }}

      # Full history: the build step resolves refs with `git show <ref>:<path>`,
      # so a shallow clone that lacks the branch tip cannot produce artifacts.
      - name: Checkout KTPAMXX at the ref under test
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPAMXX
          ref: ${{ env.AMXX_REF }}
          path: KTPAMXX
          fetch-depth: 0
          token: ${{ secrets.KTP_CHECKOUT_TOKEN || github.token }}

      - name: Checkout KTPHLStatsX at the ref under test
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPHLStatsX
          ref: ${{ env.DAEMON_REF }}
          path: KTPHLStatsX
          fetch-depth: 0
          token: ${{ secrets.KTP_CHECKOUT_TOKEN || github.token }}

      - name: Checkout KTPMatchHandler for the test-mode match driver
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPMatchHandler
          ref: ${{ env.MATCHHANDLER_REF }}
          path: KTPMatchHandler
          fetch-depth: 0
          token: ${{ secrets.KTP_CHECKOUT_TOKEN || github.token }}

      # Resolve each checked-out tree once. Every later build consumes these
      # immutable values (or the exact detached working tree) rather than
      # resolving a moving branch a second time. For a SHA input, also verify
      # that actions/checkout landed on the requested commit/prefix.
      - name: Resolve and validate exact bundle commits
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          infrastructure_sha="$(git rev-parse HEAD)"
          matchhandler_sha="$(git -C KTPMatchHandler rev-parse HEAD)"
          amxx_sha="$(git -C KTPAMXX rev-parse HEAD)"
          daemon_sha="$(git -C KTPHLStatsX rev-parse HEAD)"

          validate_sha_request() {
            requested="$1"
            actual="$2"
            component="$3"
            if [[ "$requested" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              requested="${requested,,}"
              if [[ "$actual" != "$requested"* ]]; then
                echo "::error::$component checkout is $actual, not requested $requested"
                exit 1
              fi
            fi
          }
          validate_sha_request "$INFRASTRUCTURE_REF" "$infrastructure_sha" KTPInfrastructure
          validate_sha_request "$MATCHHANDLER_REF" "$matchhandler_sha" KTPMatchHandler
          validate_sha_request "$AMXX_REF" "$amxx_sha" KTPAMXX
          validate_sha_request "$DAEMON_REF" "$daemon_sha" KTPHLStatsX

          echo "infrastructure_sha=$infrastructure_sha" >> "$GITHUB_OUTPUT"
          echo "matchhandler_sha=$matchhandler_sha" >> "$GITHUB_OUTPUT"
          echo "amxx_sha=$amxx_sha" >> "$GITHUB_OUTPUT"
          echo "daemon_sha=$daemon_sha" >> "$GITHUB_OUTPUT"

      # AMXX normally ignores fake clients in extension mode. This test-only
      # core build makes the 12 in-container bots visible to the stats plugin.
      - name: Build/restore Lane B ktpamx
        if: ${{ env.LANE == 'full' }}
        id: ktpamx
        uses: ./.github/actions/build-ktpamx-laneb
        with:
          # Build from the exact checkout above. Using the local repository's
          # HEAD avoids a branch moving between checkout and the core build.
          repo: ${{ github.workspace }}/KTPAMXX
          ref: HEAD
          out: build/lane-b-artifacts/ktpamx_i386.so

      - name: Verify Lane B core belongs to the exact AMXX bundle commit
        if: ${{ env.LANE == 'full' }}
        env:
          BUNDLE_AMXX_SHA: ${{ steps.bundle.outputs.amxx_sha }}
          CORE_AMXX_SHA: ${{ steps.ktpamx.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$CORE_AMXX_SHA" != "$BUNDLE_AMXX_SHA" ]; then
            echo "::error::Lane B core came from $CORE_AMXX_SHA, but the exact bundle uses $BUNDLE_AMXX_SHA"
            exit 1
          fi

      # Cross-repo, so not actions/download-artifact: the download endpoint
      # needs actions:read on KTP-ReHLDS, which this workflow's GITHUB_TOKEN
      # does not carry. Missing or expired is fatal here rather than downstream
      # -- falling through would smoke the baked engine and report it green.
      - name: Fetch the candidate engine from KTP-ReHLDS
        if: ${{ env.LANE == 'full' && env.ENGINE_REF != '' }}
        env:
          GH_TOKEN: ${{ secrets.KTP_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::engine_ref was given but KTP_CHECKOUT_TOKEN is unset; the artifact download needs a token with actions:read on $ENGINE_REPO"
            exit 1
          fi
          python3 scripts/fetch_engine_artifact.py \
            --repo "$ENGINE_REPO" \
            --ref "$ENGINE_REF" \
            --out build/lane-b-artifacts/engine \
            --provenance build/lane-b-artifacts/engine/provenance.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime base image
        run: docker pull "$BASE_IMAGE"

      - name: Build Lane B image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -t ktp-lane-b:ci \
            -f build/lane-b/Dockerfile \
            build/lane-b

      # Artifacts come out of the COMMITS, not the working trees — see
      # tests/e2e_stats/artifacts.py. The plugin is compiled by amxxpc inside
      # the image, the same way smoke-callable.yml does it.
      - name: Build artifact set from the refs under test
        env:
          AMXX_SHA: ${{ steps.bundle.outputs.amxx_sha }}
          DAEMON_SHA: ${{ steps.bundle.outputs.daemon_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/lane-b-artifacts
          if [ "$LANE" = "corpus" ]; then
            # Corpus replay exercises committed logs through the daemon. The
            # current preprod KTPAMXX ref may not yet contain stats capture,
            # so do not make an unrelated plugin extraction a prerequisite.
            PLUGIN_ARGS="--no-plugin"
          else
            # Compile against the KTPAMXX ref under test's own include tree
            # (mounted below at /repos/KTPAMXX), not the image's baked copy.
            # The baked copy is only as new as the image; a plugin that calls
            # a native first declared on the ref under test fails there with
            # "undefined symbol" even though the ref compiles fine everywhere
            # else. The MatchHandler compile already does this
            # (--matchhandler-includes) for the same reason, and
            # build_stats_lane_artifacts.py's own usage says to pass the
            # fork's plugins/include here.
            PLUGIN_ARGS="--amxxpc /opt/hlds/dod/addons/ktpamx/scripting/amxxpc --includes /repos/KTPAMXX/plugins/include --define KTP_LANE_B_BOT_WEAPONSTATS=1"
          fi
          docker run --rm \
            -v "${PWD}/KTPAMXX:/repos/KTPAMXX:ro" \
            -v "${PWD}/KTPHLStatsX:/repos/KTPHLStatsX:ro" \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/sql:/work/sql:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build" \
            -w /work \
            ktp-lane-b:ci \
            bash -lc "
              set -euo pipefail
              python3 scripts/build_stats_lane_artifacts.py \
                --amxx-repo   /repos/KTPAMXX      --amxx-ref   '${AMXX_SHA}' \
                --daemon-repo /repos/KTPHLStatsX  --daemon-ref '${DAEMON_SHA}' \
                ${PLUGIN_ARGS} \
                --out /work/build/artifacts
            "

      - name: Record immutable four-repository bundle provenance
        env:
          INFRASTRUCTURE_SHA: ${{ steps.bundle.outputs.infrastructure_sha }}
          MATCHHANDLER_SHA: ${{ steps.bundle.outputs.matchhandler_sha }}
          AMXX_SHA: ${{ steps.bundle.outputs.amxx_sha }}
          DAEMON_SHA: ${{ steps.bundle.outputs.daemon_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The artifact collector ran in Docker, so mutate its root-owned
          # manifest in the same disposable image instead of relying on host
          # filesystem ownership details.
          docker run --rm --network none \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build" \
            -w /work ktp-lane-b:ci \
            python3 -m tests.e2e_stats.artifacts \
            --manifest /work/build/artifacts/artifact-manifest.json \
            --markdown /work/build/bundle-provenance.md \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-sha "$GITHUB_SHA" \
            --run-url "$RUN_URL" \
            --repository infrastructure "${{ github.repository_owner }}/KTPInfrastructure" "$INFRASTRUCTURE_REF" "$INFRASTRUCTURE_SHA" \
            --repository matchhandler "${{ github.repository_owner }}/KTPMatchHandler" "$MATCHHANDLER_REF" "$MATCHHANDLER_SHA" \
            --repository amxx "${{ github.repository_owner }}/KTPAMXX" "$AMXX_REF" "$AMXX_SHA" \
            --repository hlstatsx "${{ github.repository_owner }}/KTPHLStatsX" "$DAEMON_REF" "$DAEMON_SHA"
          cat build/lane-b-artifacts/bundle-provenance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate schema-23 telemetry contract and migrations
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "${PWD}/KTPHLStatsX:/repos/KTPHLStatsX:ro" \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build:ro" \
            -w /work ktp-lane-b:ci \
            bash -lc '
              set -euo pipefail
              perl /repos/KTPHLStatsX/scripts/selftest-telemetry22.pl
              python3 /repos/KTPHLStatsX/scripts/selftest-migration22.py \
                --infrastructure-root /work \
                --migration /work/build/artifacts/sql/migrate_022_objective_attempts_grenade_entities.sql
              python3 /repos/KTPHLStatsX/scripts/selftest-migration25.py \
                --infrastructure-root /work \
                --migration /work/build/artifacts/sql/migrate_025_position_state_map_revision.sql
            '

      - name: Assemble full-match daemon and base schema
        if: ${{ env.LANE == 'full' }}
        run: |
          set -euo pipefail
          bash scripts/assemble_daemon_tree.sh \
            KTPHLStatsX build/lane-b-artifacts/daemon
          awk '
            /^-- Dumping data for table / { in_data=1; next }
            in_data && /^UNLOCK TABLES;/ { in_data=0; next }
            !in_data { print }
          ' tests/e2e_stats/fixtures/regression-2026-08-13-match1/hlstatsx-fixture.sql \
            > build/lane-b-artifacts/base-schema.sql
          test "$(grep -c '^INSERT' build/lane-b-artifacts/base-schema.sql || true)" -eq 0
          test "$(grep -c '^CREATE TABLE' build/lane-b-artifacts/base-schema.sql)" -gt 0

      # Deliberately ungated. `--network none` over committed sources only —
      # no bot, no match, no artifact from a full-gated step — so this belongs
      # to `corpus`'s determinism claim rather than `full`'s. It was full-only,
      # which is how `assert report["schema_version"] == 8` sat red on main for
      # a day with nothing that fires on a merge able to see it.
      - name: Lane B harness unit tests
        run: |
          docker run --rm --network none \
            -v "${PWD}/.github:/work/.github:ro" \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/sql:/work/sql:ro" \
            -v "${PWD}/config:/work/config:ro" \
            -w /work ktp-lane-b:ci \
            python3 -m pytest \
              tests/e2e_stats \
              tests/unit/test_accumulation_v3.py \
              tests/unit/test_life_impact_v4.py \
              tests/unit/test_momentum_v5.py \
              tests/unit/test_points_timeline.py \
              tests/unit/test_lane_b_match_report.py \
              -q

      - name: Run full synthetic 6v6 match with 12 bots
        if: ${{ env.LANE == 'full' }}
        run: |
          set -euo pipefail
          ENGINE_ARGS=""
          if [ -n "$ENGINE_REF" ]; then
            test -f build/lane-b-artifacts/engine/engine_i486.so
            ENGINE_ARGS="--engine-so /work/build/engine/engine_i486.so --engine-provenance /work/build/engine/provenance.json"
          fi
          # Written by the builder as paths under this same /work/build mount, holding only what the daemon ref carries.
          mapfile -t schema_migrations < build/lane-b-artifacts/artifacts/schema-migrations.txt
          test "${#schema_migrations[@]}" -gt 0
          # hlds is 32-bit and reaches sockets through socketcall. When this step
          # dies at boot with "UDP_OpenSocket: Function not implemented" the cause
          # is the sandbox refusing a syscall, not the engine -- and no run recorded
          # which kernel or docker it was on, so the boot failures from 2026-10-26
          # could not be told apart while every input of ours stayed identical.
          echo "boot-env: kernel=$(uname -r) docker=$(docker version -f '{{.Server.Version}}') seccomp=${LANE_B_SECCOMP:-default}"
          SECCOMP_ARGS=""
          if [ -n "${LANE_B_SECCOMP:-}" ]; then
            SECCOMP_ARGS="--security-opt seccomp=${LANE_B_SECCOMP}"
          fi
          docker run --rm --network none ${SECCOMP_ARGS} \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/config:/work/config:ro" \
            -v "${PWD}/sql:/work/sql:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build" \
            -v "${PWD}/KTPMatchHandler:/src/KTPMatchHandler:ro" \
            -v "${PWD}/KTPAMXX/plugins/include:/src/KTPAMXX/plugins/include:ro" \
            -w /work ktp-lane-b:ci \
            python3 -u scripts/lane_b_e2e.py \
              ${ENGINE_ARGS} \
              --ktpamx-so /work/build/ktpamx_i386.so \
              --dodx-so /work/build/dodx_ktp_i386.so \
              --amxx-gamedata /work/build/artifacts/gamedata \
              --plugin /work/build/artifacts/stats_logging.amxx \
              --config-dir /work/config/local \
              --hlstats /work/build/daemon/hlstats.pl \
              --schema /work/build/base-schema.sql \
                       "${schema_migrations[@]}" \
              --seed /work/build/artifacts/sql/migrate_003_assist_action.sql \
                     /work/build/artifacts/sql/migrate_004_cap_break_action.sql \
                     /work/tests/e2e_stats/fixtures/lane_b_standard_actions.sql \
              --map "$MAP_NAME" --per-team 6 --play-seconds "$PLAY_SECONDS" \
              --shot-detail "${SHOT_DETAIL:--1}" \
              --shot-detail-types "${SHOT_DETAIL_TYPES:--1}" \
              --matchhandler-src /src/KTPMatchHandler \
              --matchhandler-includes /src/KTPAMXX/plugins/include \
              --artifact-manifest /work/build/artifacts/artifact-manifest.json \
              --require-complete-coverage \
              --log /work/build/lane-b-e2e.log \
              --out /work/build/lane-b-e2e.json \
              --summary-out /work/build/lane-b-summary.md \
              --match-report-dir /work/build/match-report \
              --database-dump /work/build/database-dump.sql \
              --report-profile /work/config/analytics/accumulation_v6_schema22_2s.toml \
              --map-objectives /work/config/analytics/map_objectives.toml \
              --objective-score-fixture-template \
                /work/tests/e2e_stats/fixtures/team_score/lane-b-observer-template.json

      - name: Publish match summary
        if: ${{ always() && env.LANE == 'full' }}
        run: |
          if [ -f build/lane-b-artifacts/lane-b-summary.md ]; then
            cat build/lane-b-artifacts/lane-b-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Lane B did not produce a match summary' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Replay deterministic stats corpus
        if: ${{ env.LANE == 'corpus' }}
        run: |
          set -euo pipefail
          # KTPHLStatsX is intentionally delta-only. Compose its three fork
          # files over pinned upstream libraries before replaying; production
          # has those libraries in /opt/hlstatsx already, a fresh CI container
          # does not.
          bash scripts/assemble_daemon_tree.sh \
            KTPHLStatsX \
            build/lane-b-artifacts/daemon
          # The committed regression fixture is a production-derived dump.
          # Strip every mysqldump data block, leaving DDL only, so the KTP
          # overlay migrations have their stock HLStatsX base tables. Refuse
          # to proceed if an INSERT survives the extraction.
          awk '
            /^-- Dumping data for table / { in_data=1; next }
            in_data && /^UNLOCK TABLES;/ { in_data=0; next }
            !in_data { print }
          ' tests/e2e_stats/fixtures/regression-2026-08-13-match1/hlstatsx-fixture.sql \
            > build/lane-b-artifacts/base-schema.sql
          test "$(grep -c '^INSERT' build/lane-b-artifacts/base-schema.sql || true)" -eq 0
          test "$(grep -c '^CREATE TABLE' build/lane-b-artifacts/base-schema.sql)" -gt 0
          # Written by the builder as paths under this same /work/build mount, holding only what the daemon ref carries.
          mapfile -t schema_migrations < build/lane-b-artifacts/artifacts/schema-migrations.txt
          test "${#schema_migrations[@]}" -gt 0
          set +e
          docker run --rm \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build:ro" \
            -w /work \
            ktp-lane-b:ci \
            python3 scripts/replay_corpus.py \
              --hlstats /work/build/daemon/hlstats.pl \
              --schema /work/build/base-schema.sql \
                       /work/build/artifacts/sql/ktp_schema.sql \
                       "${schema_migrations[@]}" \
              --seed /work/build/artifacts/sql/migrate_003_assist_action.sql \
                     /work/build/artifacts/sql/migrate_004_cap_break_action.sql \
                     /work/tests/e2e_stats/fixtures/lane_b_standard_actions.sql \
            2>&1 | tee build/lane-b-artifacts/corpus-replay.out
          corpus_status=${PIPESTATUS[0]}
          set -e
          if [ "$corpus_status" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Corpus replay::$line"
            done < <(tail -n 40 build/lane-b-artifacts/corpus-replay.out)
          fi
          exit "$corpus_status"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-b-reports-${{ github.run_id }}-${{ matrix.run_index }}
          path: |
            build/lane-b-artifacts/lane-b-summary.md
            build/lane-b-artifacts/lane-b-e2e.json
            build/lane-b-artifacts/lane-b-e2e.log
            build/lane-b-artifacts/hlstats-e2e.out
            build/lane-b-artifacts/corpus-replay.out
            build/lane-b-artifacts/match-report/
            build/lane-b-artifacts/private-analytics/
            build/lane-b-artifacts/database-dump.sql
            build/lane-b-artifacts/bundle-provenance.md
            build/lane-b-artifacts/artifacts/artifact-manifest.json
            build/lane-b-artifacts/artifacts/schema-migrations.txt
            build/lane-b-artifacts/daemon/PROVENANCE
            build/lane-b-artifacts/engine/provenance.json
          if-no-files-found: warn
          retention-days: 30

  socket-probe:
    # Lane B dies at hlds boot with
    #   WARNING: UDP_OpenSocket: port: 27015 socket: Function not implemented
    # and KTP-ReHLDS net_ws.cpp:1589 shows the call is a plain
    # socket(PF_INET, SOCK_DGRAM, IPPROTO_UDP). ENOSYS is what docker's default
    # seccomp profile returns for a syscall it does not allow, and hlds is
    # 32-bit, so that call reaches the kernel either as the i386 `socket`
    # syscall (359) or through the `socketcall` multiplexer (102). Which one
    # is refused decides what a narrow profile must allow, and no Lane B log
    # can say, because none of them records a syscall.
    if: ${{ inputs.socket_probe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Environment under test
        run: |
          set -euo pipefail
          echo "kernel     : $(uname -r)"
          echo "docker     : $(docker version -f '{{.Server.Version}}')"
          echo "libseccomp : $(dpkg-query -W -f='${Version}' libseccomp2 2>/dev/null || echo unknown)"

      - name: Build the 32-bit static probe
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib >/dev/null
          cat > probe.c <<'CEOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <sys/socket.h>
          #include <netinet/in.h>

          /* i386 numbers, hardcoded because this binary is -m32 and which of the
             two the filter refuses is the entire question. */
          #define I386_SOCKETCALL 102
          #define I386_SOCKET     359
          #define SYS_SOCKET_OP   1

          static void report(const char *what, long rc) {
              if (rc >= 0) {
                  printf("  %-26s OK (fd=%ld)\n", what, rc);
                  close((int)rc);
              } else {
                  printf("  %-26s FAIL errno=%d (%s)%s\n", what, errno, strerror(errno),
                         errno == ENOSYS ? "   <-- ENOSYS: refused by the filter" : "");
              }
          }

          int main(void) {
              printf("probe: 32-bit, statically linked\n");
              errno = 0;
              report("glibc socket()", (long)socket(PF_INET, SOCK_DGRAM, IPPROTO_UDP));
              errno = 0;
              report("syscall(359) socket", syscall(I386_SOCKET, PF_INET, SOCK_DGRAM, IPPROTO_UDP));
              unsigned long a[3] = { PF_INET, SOCK_DGRAM, IPPROTO_UDP };
              errno = 0;
              report("syscall(102) socketcall", syscall(I386_SOCKETCALL, SYS_SOCKET_OP, a));
              /* Control: if this fails too, the probe is measuring something other
                 than the socket rules. */
              errno = 0;
              report("control getpid()", (long)getpid());
              return 0;
          }
          CEOF
          # Static, so the container needs no 32-bit libraries and the answer
          # is about the sandbox rather than about any image's contents.
          gcc -m32 -static -O0 -o probe probe.c
          file probe
      # One helper, used by every arm: it is the guard, not the runner.
      # An arm that prints nothing must FAIL, because the first version of
      # this probe went green on three empty arms.
      - name: Arm 0 - can a 32-bit static binary execute here at all?
        run: |
          set -euo pipefail
          out="$(docker run --rm --network none -v "${PWD}/probe:/probe:ro" \
            ubuntu:24.04 /bin/sh -c '
              echo "container arch : $(uname -m)";
              echo "probe on disk  : $(ls -l /probe)";
              /probe; echo "probe exit     : $?"
            ' 2>&1 || true)"
          printf '%s\n' "$out"
          test -n "$out" || { echo "::error::arm 0 produced NO output at all"; exit 1; }
          case "$out" in
            *"container arch"*) : ;;
            *) echo "::error::the container did not even reach uname; /probe never ran"; exit 1 ;;
          esac

      - name: Arm 1 - default seccomp profile (the failing condition)
        run: |
          set -euo pipefail
          # No --security-opt: this is exactly what Lane B's boot container gets.
          out="$(docker run --rm --network none \
            -v "${PWD}/probe:/probe:ro" ubuntu:24.04 \
            /bin/sh -c '/probe; echo "probe exit: $?"' 2>&1 || true)"
          printf '%s\n' "$out"
          # The guard. An empty arm is not a passing arm.
          test -n "$out" || { echo "::error::arm 1 produced NO output"; exit 1; }
          echo "$out" | grep -q "probe:" || { echo "::error::arm 1 ran but the probe never printed its banner"; exit 1; }

      - name: Arm 2 - unconfined (control - all four calls must succeed)
        run: |
          set -euo pipefail
          # If anything FAILS here, the cause is not the profile and arms 1 and 3 mean nothing.
          out="$(docker run --rm --network none --security-opt seccomp=unconfined \
            -v "${PWD}/probe:/probe:ro" ubuntu:24.04 \
            /bin/sh -c '/probe; echo "probe exit: $?"' 2>&1 || true)"
          printf '%s\n' "$out"
          # The guard. An empty arm is not a passing arm.
          test -n "$out" || { echo "::error::arm 2 produced NO output"; exit 1; }
          echo "$out" | grep -q "probe:" || { echo "::error::arm 2 ran but the probe never printed its banner"; exit 1; }

      - name: Arm 3 - allow-all filter (a profile rule, or seccomp itself?)
        run: |
          set -euo pipefail
          # Still goes THROUGH seccomp, so passing here while arm 1 fails
          # proves the cause is a profile RULE, which is what makes a narrow
          # profile possible instead of unconfined.
          cat > allow.json <<'JEOF'
          {
            "defaultAction": "SCMP_ACT_ALLOW",
            "archMap": [
              { "architecture": "SCMP_ARCH_X86_64",
                "subArchitectures": ["SCMP_ARCH_X86", "SCMP_ARCH_X32"] }
            ],
            "syscalls": []
          }
          JEOF
          out="$(docker run --rm --network none --security-opt seccomp=allow.json \
            -v "${PWD}/probe:/probe:ro" ubuntu:24.04 \
            /bin/sh -c '/probe; echo "probe exit: $?"' 2>&1 || true)"
          printf '%s\n' "$out"
          test -n "$out" || { echo "::error::arm 3 produced NO output"; exit 1; }

      - name: Arm 4 - the narrow profile (the proposed fix)
        run: |
          set -euo pipefail
          # The whole point: socketcall must come back OK here while arm 1 still
          # refuses it. If arm 4 and arm 1 agree, the profile changed nothing and
          # the file is decoration.
          out="$(docker run --rm --network none \
            --security-opt seccomp=ci/seccomp/lane-b-i386.json \
            -v "${PWD}/probe:/probe:ro" ubuntu:24.04 \
            /bin/sh -c '/probe; echo "probe exit: $?"' 2>&1 || true)"
          printf '%s\n' "$out"
          test -n "$out" || { echo "::error::arm 4 produced NO output"; exit 1; }
          echo "$out" | grep -q "socketcall    OK" || {
            echo "::error::arm 4 did NOT unblock socketcall -- the profile does not fix the boot"; exit 1; }
          echo "$out" | grep -q "glibc socket()             OK" || {
            echo "::error::arm 4 unblocked the raw call but not glibc's socket()"; exit 1; }
          echo "narrow profile allows socketcall and glibc socket(): the fix holds"
