# KTP Lane B — stats-capture end-to-end (bots + ephemeral MySQL, containerised)
#
# Runs on a GITHUB-HOSTED runner, deliberately, not the Tier 2 self-hosted one:
#
#   - The Tier 2 runner is on the data server, which also runs production
#     HLStatsX, and is deliberately Docker-free (TEST_INFRASTRUCTURE_PLAN).
#   - That box keeps a serverfiles tree that must MATCH THE LIVE FLEET, with a
#     drift tripwire and a manual-only re-sync. A third-party bot .so anywhere
#     near it is exactly the drift the tripwire exists to catch.
#   - GH-hosted has Docker, has no production anything, and cannot reach the
#     fleet. publish-base-image.yml already builds this 2 GB image here and
#     smoke-callable.yml already boots the runtime container here, so the shape
#     is proven.
#
# NOT a required status check, and no `pull_request` trigger. Bot AI is
# non-deterministic; a lane that can flake must never gate a merge, or the
# result is the "disable the integration test to merge the urgent fix"
# antipattern TEST_INFRASTRUCTURE_PLAN already warns about. Lane A
# (tier2-integration.yml) is the gate.
#
# ## What this proves, and what it does not
#
# The image is a RECONSTRUCTION of the fleet built from repo refs — the real
# fleet is bare metal with artifacts staged as `.new` and swapped at the 03:00
# ET restart (docs/DEPLOYING.md). Green here means "this branch's code works
# against this branch's stack", which is what you want when testing a branch.
# It does NOT mean "works against what is currently deployed". That question
# still belongs to the Tier 2 runner's fleet-matching tree.

name: Lane B Stats E2E

on:
  workflow_call:
    inputs:
      amxx_ref:
        description: KTPAMXX ref under test
        required: true
        type: string
      daemon_ref:
        description: KTPHLStatsX ref under test
        required: true
        type: string
      lane:
        description: "'corpus', 'full', or 'db-only'"
        required: false
        type: string
        default: corpus
      infrastructure_ref:
        description: KTPInfrastructure ref containing the reusable harness
        required: false
        type: string
        default: preprod
  workflow_dispatch:
    inputs:
      amxx_ref:
        description: 'KTPAMXX ref under test (e.g. feat/stats-positions)'
        required: true
        type: string
        default: 'feat/stats-positions'
      daemon_ref:
        description: 'KTPHLStatsX ref under test (e.g. feat/seed-cap-break-action)'
        required: true
        type: string
        default: 'feat/seed-cap-break-action'
      lane:
        description: >-
          'full' = bots + server + database. 'db-only' = schema/migrations/daemon
          probe. 'corpus' = deterministic committed-log replay and is the merge
          gate. Use db-only only when explicitly testing the cheap live half.
        required: false
        type: choice
        options: [full, db-only, corpus]
        default: full
      map_name:
        description: 'Map to run bots on'
        required: false
        type: string
        default: 'dod_anzio'
      play_seconds:
        description: 'How long to let the bots play'
        required: false
        type: string
        default: '180'
      bot:
        description: 'Which bot mod (marinebot primary, new_bot fallback)'
        required: false
        type: choice
        options: [marinebot, new_bot]
        default: marinebot
  schedule:
    # 06:00 UTC. Deliberately between publish-base-image (04:30 UTC — so we
    # pull a fresh base) and Tier 2's nightly (09:00 UTC — so two hlds-booting
    # suites never overlap).
    - cron: '0 6 * * *'

permissions:
  contents: read
  packages: read

concurrency:
  # One Lane B at a time. Two concurrent runs would each boot hlds and mariadbd
  # in their own container, which is fine, but serialising keeps the report
  # artifact unambiguous.
  group: lane-b-stats-e2e
  cancel-in-progress: false

jobs:
  lane-b:
    name: Lane B (${{ inputs.lane || 'full' }}, ${{ matrix.target_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Scheduled coverage is intentionally preprod-only until the production
      # (main) leg is explicitly enabled. Called/manual runs retain their
      # requested infrastructure ref.
      matrix:
        target_ref: ${{ github.event_name == 'schedule' && fromJSON('["preprod"]') || inputs.infrastructure_ref != '' && fromJSON(format('["{0}"]', inputs.infrastructure_ref)) || fromJSON(format('["{0}"]', github.ref_name)) }}

    env:
      AMXX_REF: ${{ inputs.amxx_ref || matrix.target_ref }}
      DAEMON_REF: ${{ inputs.daemon_ref || matrix.target_ref }}
      LANE: ${{ inputs.lane || 'full' }}
      MAP_NAME: ${{ inputs.map_name || 'dod_anzio' }}
      PLAY_SECONDS: ${{ inputs.play_seconds || '180' }}
      BOT: ${{ inputs.bot || 'marinebot' }}
      BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/ktp-runtime-test-base:latest

    steps:
      - name: Checkout KTPInfrastructure
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPInfrastructure
          ref: ${{ matrix.target_ref }}
          path: KTPInfrastructure

      # Full history: the build step resolves refs with `git show <ref>:<path>`,
      # so a shallow clone that lacks the branch tip cannot produce artifacts.
      - name: Checkout KTPAMXX at the ref under test
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPAMXX
          ref: ${{ env.AMXX_REF }}
          path: KTPAMXX
          fetch-depth: 0
          token: ${{ secrets.KTP_CHECKOUT_TOKEN || github.token }}

      - name: Checkout KTPHLStatsX at the ref under test
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/KTPHLStatsX
          ref: ${{ env.DAEMON_REF }}
          path: KTPHLStatsX
          fetch-depth: 0
          token: ${{ secrets.KTP_CHECKOUT_TOKEN || github.token }}

      # ---------------------------------------------------------------------
      # The bot kit. Third-party and not ours to redistribute, so it is not in
      # any repo and not baked into any image. CI pulls it from a private
      # location held in a secret.
      #
      # If the secret is absent and the caller asked for a full run, FAIL. A
      # skip here would be indistinguishable from coverage — the same trap the
      # five skip-marked addbot tests fell into, and the reason conftest.py
      # fails rather than skips when pointed at an unreachable server.
      # ---------------------------------------------------------------------
      - name: Fetch bot kit
        if: ${{ env.LANE == 'full' }}
        env:
          BOT_KIT_URL: ${{ secrets.LANE_B_BOT_KIT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_KIT_URL:-}" ]; then
            echo "::error::LANE_B_BOT_KIT_URL secret is not set, but lane=full needs a bot."
            echo "Set the secret to an authenticated tarball URL containing:"
            echo "    <bot>/<bot>.so   and   <bot>/wps|waypoints/..."
            echo "Or run this workflow with lane=db-only to exercise only the"
            echo "schema/migration/daemon half. Refusing to skip: a configured-but-"
            echo "absent bot must not read as a green stats run."
            exit 1
          fi
          mkdir -p KTPInfrastructure/bot-kit
          curl -fsSL "$BOT_KIT_URL" -o /tmp/bot-kit.tar.gz
          tar -xzf /tmp/bot-kit.tar.gz -C KTPInfrastructure/bot-kit
          echo "bot kit contents:"
          find KTPInfrastructure/bot-kit -maxdepth 2 -type f | head -20
          test -f "KTPInfrastructure/bot-kit/${BOT}/${BOT}.so" \
            || { echo "::error::${BOT}/${BOT}.so missing from the bot kit"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime base image
        run: docker pull "$BASE_IMAGE"

      - name: Build Lane B image
        working-directory: KTPInfrastructure
        run: |
          set -euo pipefail
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -t ktp-lane-b:ci \
            -f build/lane-b/Dockerfile \
            build/lane-b

      # Artifacts come out of the COMMITS, not the working trees — see
      # tests/e2e_stats/artifacts.py. The plugin is compiled by amxxpc inside
      # the image, the same way smoke-callable.yml does it.
      - name: Build artifact set from the refs under test
        working-directory: KTPInfrastructure
        run: |
          set -euo pipefail
          mkdir -p build/lane-b-artifacts
          if [ "$LANE" = "corpus" ]; then
            # Corpus replay exercises committed logs through the daemon. The
            # current preprod KTPAMXX ref may not yet contain stats capture,
            # so do not make an unrelated plugin extraction a prerequisite.
            PLUGIN_ARGS="--no-plugin"
          else
            PLUGIN_ARGS="--amxxpc /opt/hlds/dod/addons/ktpamx/scripting/amxxpc --includes /opt/hlds/dod/addons/ktpamx/scripting/include"
          fi
          docker run --rm \
            -v "${PWD}/..:/repos:ro" \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build" \
            -w /work \
            ktp-lane-b:ci \
            bash -lc "
              set -euo pipefail
              python3 scripts/build_stats_lane_artifacts.py \
                --amxx-repo   /repos/KTPAMXX      --amxx-ref   '${AMXX_REF}' \
                --daemon-repo /repos/KTPHLStatsX  --daemon-ref '${DAEMON_REF}' \
                ${PLUGIN_ARGS} \
                --out /work/build/artifacts
            "

      - name: Phase 0 spike (facts, not assertions)
        if: ${{ env.LANE != 'corpus' }}
        working-directory: KTPInfrastructure
        run: |
          set -euo pipefail
          SPIKE_ARGS=""
          if [ "$LANE" = "db-only" ]; then
            SPIKE_ARGS="--skip-server"
          fi
          docker run --rm \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build" \
            $( [ "$LANE" = "full" ] && echo -v "${PWD}/bot-kit:/opt/bot-kit:ro" ) \
            -w /work \
            ktp-lane-b:ci \
            bash -lc "
              python3 scripts/spike_bot_lane.py \
                --serverfiles /opt/hlds --in-place \
                --bot-kit /opt/bot-kit --bot '${BOT}' \
                --map '${MAP_NAME}' --play-seconds '${PLAY_SECONDS}' \
                --schema /work/build/artifacts/sql/ktp_schema.sql \
                --seed   /work/build/artifacts/sql/migrate_003_assist_action.sql \
                         /work/build/artifacts/sql/migrate_004_cap_break_action.sql \
                --out /work/build/spike-report.json \
                ${SPIKE_ARGS}
            "

      - name: Replay deterministic stats corpus
        if: ${{ env.LANE == 'corpus' }}
        working-directory: KTPInfrastructure
        run: |
          set -euo pipefail
          # KTPHLStatsX is intentionally delta-only. Compose its three fork
          # files over pinned upstream libraries before replaying; production
          # has those libraries in /opt/hlstatsx already, a fresh CI container
          # does not.
          bash scripts/assemble_daemon_tree.sh \
            ../KTPHLStatsX \
            build/lane-b-artifacts/daemon
          # The committed regression fixture is a production-derived dump.
          # Strip every mysqldump data block, leaving DDL only, so the KTP
          # overlay migrations have their stock HLStatsX base tables. Refuse
          # to proceed if an INSERT survives the extraction.
          awk '
            /^-- Dumping data for table / { in_data=1; next }
            in_data && /^UNLOCK TABLES;/ { in_data=0; next }
            !in_data { print }
          ' tests/e2e_stats/fixtures/regression-2026-08-13-match1/hlstatsx-fixture.sql \
            > build/lane-b-artifacts/base-schema.sql
          test "$(grep -c '^INSERT' build/lane-b-artifacts/base-schema.sql || true)" -eq 0
          test "$(grep -c '^CREATE TABLE' build/lane-b-artifacts/base-schema.sql)" -gt 0
          docker run --rm \
            -v "${PWD}/tests:/work/tests:ro" \
            -v "${PWD}/scripts:/work/scripts:ro" \
            -v "${PWD}/build/lane-b-artifacts:/work/build:ro" \
            -w /work \
            ktp-lane-b:ci \
            python3 scripts/replay_corpus.py \
              --hlstats /work/build/daemon/hlstats.pl \
              --schema /work/build/base-schema.sql \
                       /work/build/artifacts/sql/ktp_schema.sql \
              --seed /work/build/artifacts/sql/migrate_003_assist_action.sql \
                     /work/build/artifacts/sql/migrate_004_cap_break_action.sql

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-b-reports
          path: |
            KTPInfrastructure/build/lane-b-artifacts/spike-report.json
            KTPInfrastructure/build/lane-b-artifacts/artifacts/artifact-manifest.json
            KTPInfrastructure/build/lane-b-artifacts/lane-b-report.json
          if-no-files-found: warn
          retention-days: 30
