name: Coordination check (reusable)

# Authored by andsmit9. It lives HERE, not in andsmit9/ktp-coordination, for one reason:
# GitHub resolves a private repo's reusable workflow only for repos under the SAME owner,
# so `uses: andsmit9/ktp-coordination/...` failed at STARTUP in every caller -- no steps,
# no logs, and the run named after the file instead of this `name:`. That is not a
# permissions setting; there is nothing to grant. This repo is public, so it resolves.
# The coordination STATE stays private in andsmit9/ktp-coordination and is still reached
# by the deploy-key clone below.
#
# Called by a thin workflow in each participating code repo:
#
#   name: Coordination check
#   on: pull_request
#   jobs:
#     check:
#       uses: afraznein/KTPInfrastructure/.github/workflows/coordination-check-reusable.yml@<sha>
#       with:
#         repo_name: KTPAMXX
#       secrets:
#         COORD_DEPLOY_KEY: ${{ secrets.COORD_DEPLOY_KEY }}
#
# Pin a SHA, not @main: a moving ref means whatever lands next runs on every PR across
# every caller. Pass the one secret explicitly rather than `secrets: inherit`, which hands
# a gate the whole secret set.
#
# Requires an Actions secret COORD_DEPLOY_KEY in the calling repo: the private half of a
# read-only SSH deploy key added to andsmit9/ktp-coordination. See that repo's README.
#
# If the coordination clone fails
#
# Symptom: the "Load coordination repo deploy key" or "Clone coordination repo" step
# fails, typically `Permission denied (publickey)`, `Repository not found`, or an
# ssh-agent error on an empty key. Every gated PR fails the same way, whatever its body says.
#
# Causes, most likely first: the deploy key was removed or rotated on
# andsmit9/ktp-coordination (only andsmit9 can manage it: a personal repo has no other
# admin); COORD_DEPLOY_KEY in the calling repo is missing, empty or no longer matches the
# public half; the repo was renamed or made unreachable. GitHub secrets are write-only, so
# the private half cannot be read back, only re-set from the operator's offline key store.
#
# Escape hatches (the gated repos have enforce_admins off):
#   1. Admin-merge past the failing check.
#   2. Drop `check / check` from the branch's required status checks.
#   3. Restore: andsmit9 re-adds the deploy key to ktp-coordination, then re-set
#      COORD_DEPLOY_KEY in each calling repo from the offline copy.

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
    secrets:
      COORD_DEPLOY_KEY:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Extract workstream slug from PR body
        id: slug
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          SLUG=$(printf '%s\n' "$PR_BODY" | grep -oP '(?<=^Coordination-Workstream: ).+' | head -1 || true)
          if [ -z "$SLUG" ]; then
            echo "::error::PR body is missing a 'Coordination-Workstream: <slug>' line. See the ktp-coordination repo README."
            exit 1
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Load coordination repo deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.COORD_DEPLOY_KEY }}

      - name: Clone coordination repo
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:andsmit9/ktp-coordination.git coord

      - name: Verify workstream exists
        id: state
        run: |
          STATE="coord/state/${{ steps.slug.outputs.slug }}.md"
          if [ ! -f "$STATE" ]; then
            echo "::error::Unknown workstream '${{ steps.slug.outputs.slug }}' — no $STATE in ktp-coordination."
            exit 1
          fi
          echo "path=$STATE" >> "$GITHUB_OUTPUT"

      - name: Verify workstream is not closed
        run: |
          status=$(awk 'NR==1&&$0!="---"{exit} NR>1&&$0=="---"{exit} NR>1&&index($0,"status:")==1{sub("status:[ ]*","");print;exit}' "${{ steps.state.outputs.path }}")
          case "${status:-active}" in
            done)
              echo "::error::Workstream '${{ steps.slug.outputs.slug }}' is closed (status: done). Bump it to a new version (/bump) or open a new slug, then re-tag this PR."
              exit 1 ;;
            superseded)
              succ=$(awk 'NR==1&&$0!="---"{exit} NR>1&&$0=="---"{exit} NR>1&&index($0,"superseded_by:")==1{sub("superseded_by:[ ]*","");print;exit}' "${{ steps.state.outputs.path }}")
              echo "::error::Workstream '${{ steps.slug.outputs.slug }}' is superseded by '${succ}'. Tag the PR with the live version's slug."
              exit 1 ;;
          esac

      - name: Verify this repo is in scope
        run: |
          if ! grep -qE "^\| *${{ inputs.repo_name }} *\|" "${{ steps.state.outputs.path }}"; then
            echo "::error::Repo '${{ inputs.repo_name }}' is not listed in workstream '${{ steps.slug.outputs.slug }}''s Repos in scope table."
            exit 1
          fi

      - name: Verify any Blocked-by entry is cleared
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A blocked_by cell holds two different kinds of reference and they resolve
          # differently. A dpl- id is a DEPLOY, recorded in NEIN-DEPLOY.md; looking one
          # up with `gh pr view` can only ever return "unknown", so every PR in the
          # workstream failed with a message naming the PR -- reading as a fault in the
          # PR rather than a deploy nobody has run yet.
          #
          # Selecting that row by repo name alone and taking `head -1` made a stacked
          # workstream block every one of its own PRs on whichever happened to be listed
          # first -- #547 read #548's row and was told it was blocked by #547. Match the
          # PR under test against the PR CELL only; a blocked_by cell holds PR urls too,
          # so a whole-row match finds the blocker's row instead of the blocked one.
          #
          # scripts/test-coordination-row-select.sh extracts the awk between the markers
          # below and runs it against fixtures; move the markers and the test fails loudly.
          # --- BEGIN row-select ---
          selection=$(awk -v want="${{ inputs.repo_name }}" -v pr="${{ github.event.pull_request.number }}" '
            BEGIN { FS = "|"; insec = 0; n = 0; hit = 0
                    # pr reaches a dynamic regex below, so anything but digits is refused
                    # rather than compiled -- an unanchored id becomes a character class.
                    if (pr !~ /^[0-9]+$/) pr = "" }
            /^## / { insec = ($0 ~ /^## Repos in scope[ \t]*$/); next }
            insec && /^\|/ {
              repo = $2; sub(/^[ \t]+/, "", repo); sub(/[ \t]+$/, "", repo)
              if (repo != want) next
              n++
              if (n == 1) first = $6
              cell = $6; sub(/^[ \t]+/, "", cell); sub(/[ \t]+$/, "", cell)
              if (cell != "" && cell != "\342\200\224" && cell != "-") blockers++
              if (pr != "" && !hit && ($4 ~ ("(^|[^0-9])#" pr "([^0-9]|$)") || $4 ~ ("/pull/" pr "([^0-9]|$)"))) {
                hit = 1; sel = $6
              }
            }
            END {
              # Ambiguity only matters when it could HIDE a block: with several rows and
              # no match, refuse if any of them carries a blocker, pass if none does.
              if (hit)            { mode = "row";       out = sel }
              else if (n == 1)    { mode = "single";    out = first }
              else if (n == 0)    { mode = "none";      out = "" }
              else if (blockers)  { mode = "ambiguous"; out = "" }
              else                { mode = "clear";     out = "" }
              sub(/^[ \t]+/, "", out); sub(/[ \t]+$/, "", out)
              printf "%s\n%s\n", mode, out
            }
          ' "${{ steps.state.outputs.path }}")
          # --- END row-select ---
          mode=$(printf '%s\n' "$selection" | sed -n 1p)
          blocked_by=$(printf '%s\n' "$selection" | sed -n 2p)
          pr_num="${{ github.event.pull_request.number }}"
          case "$mode" in
            row)
              echo "Using the Repos-in-scope row for PR #${pr_num}." ;;
            single)
              echo "PR #${pr_num} has no row yet; '${{ inputs.repo_name }}' has exactly one row in this workstream, so that row applies." ;;
            clear)
              echo "PR #${pr_num} has no row yet, and no '${{ inputs.repo_name }}' row in this workstream carries a Blocked-by entry -- nothing to enforce." ;;
            none)
              echo "::error::Repo '${{ inputs.repo_name }}' has no row under '## Repos in scope' in ${{ steps.state.outputs.path }}. Refusing rather than passing an unresolvable block."
              exit 1 ;;
            ambiguous)
              echo "::error::'${{ inputs.repo_name }}' has several rows in workstream '${{ steps.slug.outputs.slug }}', at least one carries a Blocked-by entry, and none names PR #${pr_num} -- which block applies is undecidable. Add this PR to its Repos-in-scope row (or add a row for it); guessing a row is how #547 ended up blocked on itself."
              exit 1 ;;
            *)
              echo "::error::Row selection produced no verdict for '${{ inputs.repo_name }}' (mode: '${mode}'). Refusing rather than continuing with an unknown Blocked-by state."
              exit 1 ;;
          esac
          ledger="coord/NEIN-DEPLOY.md"
          if [ -n "$blocked_by" ] && [ "$blocked_by" != "—" ] && [ "$blocked_by" != "-" ]; then
            # Some cells hold a sentence rather than a reference ("the operator's
            # retail-client confirmation..."). Word-splitting one into gh lookups reported
            # "Blocked by PR the, which is not merged yet" -- the same nonsense the dpl-
            # ids produced before they got their own arm. Judge the WHOLE cell once: a
            # per-word test would pass the sentence's stray number through to gh.
            # --- BEGIN refs-only ---
            refs_only='^([[:space:]]*(dpl-[A-Za-z0-9._-]+|#?[0-9]+|https?://[^[:space:]]+/pull/[0-9]+))+[[:space:]]*$'
            # --- END refs-only ---
            if ! printf '%s' "$blocked_by" | grep -qE "$refs_only"; then
              echo "::error::Blocked by a human-stated condition, not a reference this gate can resolve: \"$blocked_by\". Clear it in ktp-coordination, or restate the cell as a PR ref or dpl- id."
              exit 1
            fi
            for ref in $blocked_by; do
              case "$ref" in
                dpl-*)
                  if [ ! -f "$ledger" ]; then
                    echo "::error::Blocked by deploy $ref, but $ledger is missing, so the block cannot be resolved. Refusing rather than passing."
                    exit 1
                  fi
                  # The section runs from its own heading to the next deploy heading.
                  # index() rather than a dynamic regex: a bracketed id has to survive YAML,
                  # shell and awk escaping, and when it does not it becomes a character class
                  # -- "[dpl-bd55]" parses as an invalid range and awk dies rather than
                  # matching nothing, which is a hard failure wearing a lookup's clothes.
                  section=$(awk -v id="$ref" '
                    index($0, "### [" id "]") == 1 { inside = 1; next }
                    inside && index($0, "### [dpl-") == 1 { exit }
                    inside { print }
                  ' "$ledger")
                  if [ -z "$section" ]; then
                    echo "::error::Blocked by deploy $ref, which has no section in $ledger. Either add the deploy row or correct the blocked_by cell -- an unresolvable id must not pass silently."
                    exit 1
                  fi
                  # grep -c prints 0 and exits 1 when nothing matches; `|| true` keeps the
                  # zero without appending a second value to the capture.
                  outstanding=$(printf '%s\n' "$section" | grep -cE '^[[:space:]]*- \[ \]' || true)
                  if [ "$outstanding" != "0" ]; then
                    echo "::error::Blocked by DEPLOY $ref, which still has $outstanding step(s) outstanding in NEIN-DEPLOY.md. This is a deploy nobody has finished, not a problem with this pull request."
                    exit 1
                  fi
                  echo "deploy $ref is complete -- not blocking"
                  ;;
                \#[0-9]*|[0-9]*|*/pull/[0-9]*)
                  # `--json merged` is not a gh field (the list has mergedAt/mergedBy, no
                  # bare merged), so this branch answered "unknown" for every PR ref ever
                  # passed to it and no PR block could clear. `state` is the real field.
                  # GH_REPO is what makes a bare "547" or "#547" resolvable: nothing checks
                  # the caller out, so gh has no remote to infer a repo from. A full URL
                  # still wins over GH_REPO, which is how a cross-repo blocker resolves.
                  state=$(gh pr view "${ref#\#}" --json state --jq .state 2>/dev/null || echo "unknown")
                  if [ "$state" != "MERGED" ]; then
                    echo "::error::Blocked by PR $ref, which is not merged yet (state: $state)."
                    exit 1
                  fi
                  echo "PR $ref is merged -- not blocking"
                  ;;
                *)
                  # Unreachable while the refs_only guard above holds; if the two ever
                  # disagree, refuse rather than fall out of the case having checked nothing.
                  echo "::error::Blocked by '$ref', which is neither a deploy id nor a PR reference. Refusing rather than passing an unresolvable block."
                  exit 1
                  ;;
              esac
            done
          fi
