# Keeps `preprod` a superset of `main` without anyone hand-rolling a reconcile PR.
#
# CONTRIBUTING makes `main` the default target and `preprod` the integration
# branch for test/CI-lane work, so `preprod` falls behind by design every time a
# feature lands on `main`. That produced five hand-made reconcile PRs in three days.
#
# ALWAYS goes through a PR. The first version tried to fast-forward `preprod`
# directly and was rejected on its very first run:
#   GH006: Protected branch update failed for refs/heads/preprod
#   - 2 of 2 required status checks are in progress
# `preprod` is protected and requires two checks, so a direct push can never be
# the happy path -- not even a fast-forward. Auto-merge lands the PR unattended
# once those checks pass, which is the same outcome by a supported route.
name: Reconcile main into preprod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-preprod
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git show-ref --verify --quiet refs/remotes/origin/preprod; then
            echo "::notice::No preprod branch; nothing to reconcile."
            exit 0
          fi

          behind=$(git rev-list --count origin/preprod..origin/main)
          ahead=$(git rev-list --count origin/main..origin/preprod)
          echo "preprod is $behind behind and $ahead ahead of main."

          if [ "$behind" = "0" ]; then
            echo "::notice::preprod already contains main; nothing to do."
            exit 0
          fi

          # One open reconcile PR is enough; a second would just conflict with it.
          existing=$(gh pr list --base preprod --state open \
            --search "head:reconcile/main-into-preprod" --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::PR #$existing is already reconciling preprod; leaving it."
            exit 0
          fi

          branch="reconcile/main-into-preprod-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch" origin/preprod
          if ! git merge --no-edit origin/main; then
            # A conflict is a real disagreement between the branches; a bot must
            # not pick a side in somebody's testing branch.
            git merge --abort
            echo "::error::main and preprod conflict; reconcile by hand."
            exit 1
          fi
          git push origin "$branch"
          gh pr create --base preprod --head "$branch" --title "reconcile: main into preprod ($behind commits)" --body "Opened automatically: preprod is $behind behind and $ahead ahead of main. Auto-merge is enabled, so this lands on its own once preprod's required checks pass. preprod is protected and cannot be pushed directly, which is why this is a PR rather than a fast-forward."
          # Land it unattended once the two required checks go green.
          gh pr merge --auto --merge "$branch" || \
            echo "::warning::Could not enable auto-merge; the PR is open and needs a human."
          echo "::notice::Opened $branch."
