# Keeps `preprod` a superset of `main` without anyone hand-rolling a reconcile PR.
#
# CONTRIBUTING makes `main` the default target and `preprod` the integration
# branch for test/CI-lane work, so `preprod` falls behind by design every time a
# feature lands on `main`. That produced five hand-made reconcile PRs in three days.
#
# Three attempts, each one hiding the next, so all three are recorded here:
#   1. Fast-forward push, immediately: rejected, "2 of 2 required status checks
#      are in progress". Read at the time as "a protected branch refuses a direct
#      push". It does not -- the checks simply had not finished yet.
#   2. Open a PR + auto-merge: `gh pr create` refused outright with "GitHub
#      Actions is not permitted to create or approve pull requests", and repo
#      auto-merge is disabled besides, so the PR would have sat open anyway.
#   3. This one. Wait for the checks, then fast-forward. Measured, not assumed:
#      preprod requires NO approving review, has no push restrictions, and its
#      two required contexts are both green on main's tip by the time main's own
#      workflows finish. A push of that exact sha is therefore permitted.
#
# Why this cannot be generalised to a merge commit -- the asymmetry is the whole
# design. `integration` (tier2-integration.yml) fires on a push to main and on a
# pull_request, and on NOTHING else. A fresh merge commit pushed to a topic
# branch can never earn it, so it could never be pushed to preprod either. A
# fast-forward sidesteps that by reusing main's own already-green sha.
name: Reconcile main into preprod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reconcile-preprod
  # A newer main tip supersedes an older one: reconciling to the newest sha also
  # carries the older commits, so cancelling a waiting run loses nothing.
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git show-ref --verify --quiet refs/remotes/origin/preprod; then
            echo "::notice::No preprod branch; nothing to reconcile."
            exit 0
          fi

          target=$(git rev-parse origin/main)
          behind=$(git rev-list --count origin/preprod..origin/main)
          ahead=$(git rev-list --count origin/main..origin/preprod)
          echo "preprod is $behind behind and $ahead ahead of main (target $target)."

          if [ "$behind" = "0" ]; then
            echo "::notice::preprod already contains main; nothing to do."
            exit 0
          fi

          # The property, not the commit count: a fast-forward is possible iff
          # preprod is an ancestor of the target.
          if ! git merge-base --is-ancestor origin/preprod "$target"; then
            echo "::warning::preprod has $ahead commit(s) of its own, so this cannot be a fast-forward, and a merge commit can never satisfy preprod's 'integration' check (that job runs only on a push to main or on a pull_request). Reconcile by hand: gh pr create --base preprod --head main. Exiting 0 rather than painting an ordinary main push red."
            exit 0
          fi

          # Read the gate from the branch itself so a newly-added required check
          # is waited on rather than silently skipped.
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/preprod/protection/required_status_checks" \
                 --jq '.contexts[]' > required.txt 2>/dev/null; then
            echo "::warning::Could not read preprod's required checks (the token lacks admin read). Falling back to the two known contexts; if protection has since gained another, the push below is rejected loudly rather than skipped silently."
            printf '%s\n' 'Config parse + assertions' 'integration' > required.txt
          fi
          echo "Waiting on:"; sed 's/^/  /' required.txt

          deadline=$(( $(date +%s) + 40 * 60 ))
          while : ; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$target/check-runs" --paginate \
              --jq '.check_runs[] | [.name, (.conclusion // .status), .started_at] | @tsv' > runs.tsv

            pending=0
            failed=0
            while IFS= read -r ctx; do
              [ -n "$ctx" ] || continue
              # Latest run wins: a context can have several, from re-runs and
              # from separate suites on the same sha.
              state=$(awk -F'\t' -v c="$ctx" '$1==c && $3>b {b=$3; s=$2} END {print (s==""?"absent":s)}' runs.tsv)
              printf '  %-34s %s\n' "$ctx" "$state"
              case "$state" in
                success)                   ;;
                queued|in_progress|absent) pending=$((pending + 1)) ;;
                *)                         failed=$((failed + 1)) ;;
              esac
            done < required.txt

            if [ "$failed" -gt 0 ]; then
              echo "::error::A required check failed on main@$target. Not reconciling a broken main onto preprod."
              exit 1
            fi
            [ "$pending" -eq 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 40m waiting for main's required checks on $target."
              exit 1
            fi
            sleep 30
          done

          git push origin "$target:refs/heads/preprod"
          echo "::notice::Fast-forwarded preprod to $target ($behind commits)."
