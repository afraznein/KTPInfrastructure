# KTP Tier 2 — Integration tests against a real hlds_linux subprocess.
#
# Runs the pytest suite at tests/integration/ on a self-hosted runner that
# has a writable test serverfiles tree on ext4 (WSL DrvFs is incompatible
# with hlds_linux per memory `wsl_drvfs_hlds_incompatibility.md`). The
# runner pre-stages compiled test-mode artifacts:
#
#   - KTPMatchHandler.amxx (test-mode build, compiled/test/)
#   - KTPWitness.amxx (1.x.0+, witness/compiled/)
#   - dodx_ktp_i386.so (with test-only natives, KTPAMXX build output)
#
# The workflow assumes these are present at $KTP_HLDS_SERVERFILES.
# `tests/integration/CI_RUNNER_SETUP.md` documents the registration +
# staging procedure.
#
# Why self-hosted vs GitHub-hosted runners:
#   - hlds_linux is a 32-bit binary that needs ~50MB of game assets +
#     libsteam_api.so + KTPAMXX core. Bundling all that into a GH-hosted
#     runner image would inflate the image to >2GB; bake time per CI run
#     would be >5min just to set up. A self-hosted runner with the tree
#     pre-staged drops to <30s setup.
#   - Tier 2 needs a stable test environment with deterministic IO timing.
#     GH-hosted runners share infra; their performance varies enough to
#     introduce flakes in our 5s polling timeouts.
#
# Trigger model:
#   - Manually via workflow_dispatch (operator-driven, with timeout multiplier)
#   - On every PR to main or preprod — required status check per branch
#     protection on `main` (flipped from warn-only after 2 weeks green-on-main,
#     original design decision 2026-04-24, applied 2026-05-18) and, since the
#     preprod/prod gate was introduced, on `preprod` too.
#   - Nightly via schedule (09:00 UTC), targeting preprod only while the staged
#     stack is being proven. The main leg remains paused until production
#     enablement; paired
#     with scripts/ktp-tier2-heartbeat.sh (data-server cron) which alerts on a
#     missing/stale/failed last-run marker so a dead runner is not silently
#     green. Schedule triggers always fire from the default branch's copy of
#     this file (a GitHub Actions constraint — schedules can't run from a
#     non-default branch), so preprod coverage comes from the matrix explicitly
#     checking out that ref, not from the trigger itself.
#
# No `paths:` filter on `pull_request:` — workflow fires on every PR to main
# so the required status check `Tier 2 Integration / integration` always
# reports back. The job itself decides whether to run pytest based on what
# actually changed (see "Detect relevant changes" step). This avoids the
# GitHub-Actions gotcha where a `paths:`-filtered required check is silently
# skipped on docs-only / scripts-only PRs, leaving the PR un-mergeable
# without `--admin` override. Same self-skip-pass pattern as
# `config-tests.yml` (commit `99b0abf`).

name: Tier 2 Integration

on:
  workflow_dispatch:
    inputs:
      timeout_multiplier:
        description: 'Scale all test timeouts (1.0 = default, 2.0 = slow CI)'
        required: false
        type: string
        default: '1.0'
      matchhandler_version:
        description: 'Pre-activation gate: KTPMatchHandler version to assert (e.g. 0.10.149). Blank = the version of the pinned reviewed build this workflow compiles, which tracks THE PIN, not the fleet.'
        required: false
        type: string
        default: ''
  schedule:
    # Nightly at 09:00 UTC (≈04-05 ET) — after the 03:00 ET fleet restart +
    # perf rollups. Tier 2 otherwise only fires on PRs that touch
    # tests/integration/, so it can go weeks without exercising the live
    # plugin stack on the runner; the nightly keeps it warm and, with the
    # heartbeat below, makes a dead runner / broken schedule VISIBLE instead
    # of looking identical to "all green". Scheduled runs always run pytest
    # (the change-detection step only self-skips on pull_request events).
    - cron: '0 9 * * *'
  pull_request:
    branches: [main, preprod]

jobs:
  integration:
    # Keep the PR check context stable for branch protection. Scheduled runs
    # need the target suffix so their ref is explicit; PR/manual runs
    # remain exactly `Tier 2 Integration / integration`.
    name: ${{ github.event_name == 'schedule' && format('integration ({0})', matrix.target_ref) || 'integration' }}
    runs-on: [self-hosted, ktp-tier2]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      # Only the nightly schedule uses an explicit target matrix. It is
      # preprod-only while staged testing is underway; PR and manual dispatch
      # runs stay single-leg against whatever ref triggered them.
      # max-parallel: 1 — one hlds_linux port on the self-hosted runner, see
      # the concurrency block below for why that also needs matrix.target_ref.
      max-parallel: 1
      matrix:
        target_ref: ${{ github.event_name == 'schedule' && fromJSON('["preprod"]') || fromJSON(format('["{0}"]', github.ref_name)) }}

    # Concurrency: only one Tier 2 run at a time per (triggering ref, matrix
    # target). Job-level (not workflow-level) because it needs `matrix`,
    # which workflow-level concurrency blocks can't see.
    concurrency:
      group: tier2-${{ github.ref }}-${{ matrix.target_ref }}
      cancel-in-progress: true

    env:
      # Self-hosted runner stages the test serverfiles tree at this path.
      # See tests/integration/CI_RUNNER_SETUP.md § "Stage test serverfiles".
      # Hardcoded (not `${{ vars.X || '...' }}`) because fork PRs cannot read
      # repo-scoped Actions variables — the expression silently falls through
      # to the default on every fork PR. We own the runner; path is canonical.
      KTP_HLDS_SERVERFILES: /opt/ktp-tier2-runner/serverfiles
      # Timeout multiplier. The self-hosted runner shares the data server
      # with 25 HLTV writers + MySQL, so async curl round-trips (Discord
      # embed POSTs, HUD ingest) can exceed the 1.0/5s window — that raced
      # the match-type routing tests (one of 12man/draft/ktp_ot/draft_ot
      # flaked per run). 2.0 = the _timing.py "busy CI runner" value; a
      # manual workflow_dispatch can still override.
      KTP_TEST_TIMEOUT_MULTIPLIER: ${{ inputs.timeout_multiplier || '2.0' }}
      # Tier 2 post-run reporting (1.5.22) — pytest_sessionfinish hook in
      # tests/integration/conftest.py writes a session-summary JSON here
      # IFF this env var is set; the post-pytest step reads it and POSTs
      # a Discord embed via the relay. Unset in dev to preserve the
      # "no extra files written" loop.
      KTP_TIER2_REPORT_PATH: tier2-report.json
      # Pre-activation gate override. Resolution is env -> stage manifest ->
      # the literal floor in tests/integration/test_match_flow_spine.py (see
      # _stage_manifest.py). This workflow compiles its OWN pinned reviewed
      # KTPMatchHandler and derives the expected version from that source, so
      # the assertion tracks THE PIN — which can legitimately sit behind the
      # fleet, and currently does. Set this input to smoke a build that leads
      # the pin; it is now honoured rather than silently overwritten.
      KTP_EXPECTED_MATCHHANDLER_VERSION: ${{ inputs.matchhandler_version || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # matrix.target_ref is always the triggering ref except on schedule,
          # where it is explicitly preprod (see strategy.matrix above). The
          # schedule always *fires* from the default branch's copy of this
          # file, but each matrix leg checks out its own target content).
          # Leave PR/manual checkout at the action's event-aware default. In a
          # PR, github.ref_name is `N/merge`, which is not a branch or tag and
          # cannot be resolved when supplied explicitly. Only schedules need
          # an explicit matrix ref.
          ref: ${{ github.event_name == 'schedule' && matrix.target_ref || '' }}
          # Need diff against base for relevance detection on PRs.
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          set -e
          # Non-PR events (workflow_dispatch / workflow_call / push) always run.
          # PR events: only run if integration tests, the smoke harness, or
          # this workflow file itself changed. ALL of tests/smoke/ is in the
          # filter — the integration conftest imports rcon/server_handle/
          # parse/asserts from it, so a PR breaking any of those must not
          # green-by-self-skip (it would then fail every Tier 2 run and all
          # caller smoke workflows post-merge). The self-hosted runner's
          # pre-staged serverfiles tree covers everything else Tier 2
          # exercises; changes to scripts/, docs/, config/, or any other
          # in-repo path don't invalidate the test surface so skipping
          # pytest is safe.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "Non-PR event ${{ github.event_name }}; will run pytest."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" \
              | grep -qE '^(tests/integration/|tests/smoke/|\.github/workflows/tier2-integration\.yml$)'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "Relevant files changed; will run pytest."
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::No tests/integration/, tests/smoke/, or workflow changes in this PR; skipping pytest (job still passes so the required check is satisfied)."
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        if: steps.changes.outputs.run == '1'
        run: |
          python -m pip install --upgrade pip
          # Pinned to the same versions used in dev. pytest-rerunfailures
          # mitigates transient flakes (e.g., a 200ms curl round-trip
          # racing a 100ms poll on a busy runner). 2 reruns max.
          # allure-pytest emits per-test JSON into --alluredir for the
          # post-run report; no Allure CLI install needed at this layer
          # (operators run `allure serve <downloaded-results>` locally).
          pip install pytest==9.0.3 pytest-rerunfailures==15.0 allure-pytest==2.13.5

      # Match type retention spans KTPMatchHandler and KTPInfrastructure. Pin
      # the already-reviewed preprod merge rather than testing whichever
      # hand-staged MatchHandler binary happens to be left on the persistent
      # runner. This is a test-mode artifact only; it never enters a fleet
      # staging path.
      - name: Checkout reviewed KTPMatchHandler preprod build
        if: steps.changes.outputs.run == '1'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/KTPMatchHandler
          ref: 01de0750b51b20bf0d861365fafa336b81942ecd
          path: .tier2/KTPMatchHandler

      - name: Checkout reviewed KTPAMXX preprod includes
        if: steps.changes.outputs.run == '1'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/KTPAMXX
          ref: dfe1c8959f754e7757e3c443671240a9ef42c8db
          path: .tier2/KTPAMXX

      - name: Build + install reviewed KTPMatchHandler test artifact
        if: steps.changes.outputs.run == '1'
        env:
          TOOLCHAIN: /opt/ktp-tier2-runner/toolchain
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.tier2/KTPMatchHandler"
          SF="$KTP_HLDS_SERVERFILES"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          mkdir -p "$WORK/include"
          cp "$TOOLCHAIN"/include/*.inc "$WORK/include/"
          # Current MatchHandler consumes DODX aim-stat natives that predate
          # the runner's compiler bundle. Overlay only the reviewed source
          # includes; the runner's known-good native compiler remains in use.
          cp "$GITHUB_WORKSPACE/.tier2/KTPAMXX/plugins/include/"*.inc "$WORK/include/"
          cp "$SRC"/*.inc "$WORK/" 2>/dev/null || true
          tr -d '\r' < "$SRC/KTPMatchHandler.sma" > "$WORK/KTPMatchHandler.sma"
          printf '#define KTP_BUILD_SHA "%s"\n#define KTP_BUILD_TIME "%s"\n' \
            "$(git -C "$SRC" rev-parse --short HEAD)" "$(date -u +%Y-%m-%dT%H:%MZ)" \
            > "$WORK/include/build_info.inc"

          ( cd "$WORK" && \
            LD_LIBRARY_PATH="$TOOLCHAIN" "$TOOLCHAIN/amxxpc" \
              KTPMatchHandler.sma -i"$WORK/include" -i"$WORK" \
              -oKTPMatchHandler.amxx KTP_TEST_MODE=1 )
          install -D "$WORK/KTPMatchHandler.amxx" \
            "$SF/dod/addons/ktpamx/plugins/KTPMatchHandler.amxx"

          # Derive the version from the source we just compiled. It used to be
          # hardcoded here as well as pinned by `ref:` above -- two places that
          # had to be bumped together by hand, with nothing checking. Bumping
          # the ref alone would make the gate assert a version it did not
          # install: either a confusing red, or a green against the wrong build.
          VER="$(sed -n 's/.*#define PLUGIN_VERSION "\([^"]*\)".*/\1/p' \
                 "$SRC/KTPMatchHandler.sma" | head -1)"
          if [ -z "$VER" ]; then
            echo "::error::could not read PLUGIN_VERSION from the pinned KTPMatchHandler source"
            exit 1
          fi

          # An explicit dispatch input wins -- that is the documented escape
          # hatch for smoking a build that leads the pin. Unconditionally
          # writing GITHUB_ENV here silently overrode it, because a value
          # written to GITHUB_ENV beats the job-level `env:` for later steps.
          if [ -n "${KTP_EXPECTED_MATCHHANDLER_VERSION:-}" ]; then
            echo "Dispatch input pins the assertion to ${KTP_EXPECTED_MATCHHANDLER_VERSION}; installed build is ${VER}."
          else
            echo "KTP_EXPECTED_MATCHHANDLER_VERSION=$VER" >> "$GITHUB_ENV"
          fi
          echo "Installed reviewed KTPMatchHandler $VER test build ($(stat -c%s "$SF/dod/addons/ktpamx/plugins/KTPMatchHandler.amxx") bytes)."

      # Re-landed 2026-08-04 from the closed-unmerged PR #33. The runner's copy
      # had drifted a MONTH (staged Jul 3) because it was hand-staged and nothing
      # refreshed it -- and the belief that this workflow already recompiled was
      # the false premise the 2026-08-03 drift fix had to debunk. It was true of
      # PR #33's design and false of main, because the PR never merged.
      #
      # NOTE the deliberate asymmetry: KTPHudObserver is an EXTERNAL plugin we do
      # not review or stage, so 'always current' is right. KTPMatchHandler and
      # KTPPracticeMode are the opposite -- the runner must hold the exact reviewed
      # artifact (see stage-runner.py + the stage manifest), so they are staged and
      # pinned, never rebuilt here. PR #33 rebuilt both; only this half is wanted.
      - name: Refresh + stage KTPHudObserver.amxx from DoD-hud-observer master
        if: steps.changes.outputs.run == '1'
        # Without this, Tier 2 tested whatever KTPHudObserver.amxx was MANUALLY
        # staged on the runner — drifting silently from the live plugin (the
        # existing test_hud_observer_contract.py had the same staleness). Recompile
        # from master every run so the suite always exercises current code.
        #
        # Compiles natively with an amxxpc toolchain staged once on the runner at
        # $TOOLCHAIN (amxxpc + amxxpc32.so + include/), the same pattern as the
        # pre-staged serverfiles/ tree. No Docker: amxxpc is 32-bit, so the runner
        # needs i386 multiarch (libc6:i386 + lib32stdc++6) — already present on the
        # data server. Refresh the toolchain when KTPAMXX's compiler or includes
        # change. Hard-fails if the plugin can't be rebuilt — better than silently
        # testing a stale binary. See PR notes.
        env:
          TOOLCHAIN: /opt/ktp-tier2-runner/toolchain
        run: |
          set -euo pipefail
          SF="$KTP_HLDS_SERVERFILES"
          SRC="${RUNNER_TEMP:-/tmp}/dod-hud-src"
          rm -rf "$SRC"
          git clone --depth 1 https://github.com/JimmyLockhart65616/DoD-hud-observer.git "$SRC"
          GIT_SHA="$(git -C "$SRC" rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ)"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/include"
          cp "$TOOLCHAIN"/include/*.inc "$WORK/include/"
          printf '#define KTP_BUILD_SHA "%s"\n#define KTP_BUILD_TIME "%s"\n' "$GIT_SHA" "$BUILD_TIME" > "$WORK/include/build_info.inc"
          tr -d '\r' < "$SRC/KTPHudObserver.sma" > "$WORK/KTPHudObserver.sma"
          VER="$(grep -oE '#define VERSION "[^"]+"' "$SRC/KTPHudObserver.sma" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          ( cd "$WORK" && LD_LIBRARY_PATH="$TOOLCHAIN" "$TOOLCHAIN/amxxpc" KTPHudObserver.sma -i"$WORK/include" -oKTPHudObserver.amxx )
          install -D "$WORK/KTPHudObserver.amxx" "$SF/dod/addons/ktpamx/plugins/KTPHudObserver.amxx"
          rm -rf "$WORK"
          # Export the just-built version so the contract test asserts against it
          # instead of a hardcoded pin (no lockstep edits, no silent staleness).
          echo "KTP_EXPECTED_HUDOBSERVER_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Staged KTPHudObserver.amxx ($(stat -c%s "$SF/dod/addons/ktpamx/plugins/KTPHudObserver.amxx") bytes, v$VER, sha $GIT_SHA)"

      - name: Verify test artifacts present in serverfiles
        if: steps.changes.outputs.run == '1'
        run: |
          set -e
          SF="$KTP_HLDS_SERVERFILES"
          echo "Checking $SF for required test artifacts..."
          test -f "$SF/hlds_linux"               || { echo "MISSING: hlds_linux"; exit 1; }
          test -f "$SF/dod/addons/ktpamx/dlls/ktpamx_i386.so" || { echo "MISSING: ktpamx_i386.so"; exit 1; }
          test -f "$SF/dod/addons/ktpamx/modules/dodx_ktp_i386.so" || { echo "MISSING: dodx_ktp_i386.so"; exit 1; }
          test -f "$SF/dod/addons/ktpamx/plugins/KTPMatchHandler.amxx" || { echo "MISSING: KTPMatchHandler.amxx (must be test-mode build)"; exit 1; }
          test -f "$SF/dod/addons/ktpamx/plugins/KTPWitness.amxx" || { echo "MISSING: KTPWitness.amxx"; exit 1; }
          test -f "$SF/dod/addons/ktpamx/plugins/KTPPracticeMode.amxx" || { echo "MISSING: KTPPracticeMode.amxx (must be test-mode build)"; exit 1; }
          echo "All required artifacts present."

      - name: Run Tier 2 integration suite
        id: pytest
        if: steps.changes.outputs.run == '1'
        run: |
          # --reruns 2: retry transient failures up to 2 times before
          #   marking a test as failed. Catches I/O race flakes without
          #   masking real regressions (a true bug fails all 3 attempts).
          # --reruns-delay 1: 1s sleep between reruns to let any pending
          #   async work drain.
          # -v: verbose output for CI logs
          # -ra: short-test-summary for skipped + failed (visible in PR check)
          # --alluredir: per-test JSON for the always-uploaded Allure
          #   results bundle. Run `allure serve <download>` locally to
          #   view the HTML report; no CLI install on the runner needed.
          mkdir -p allure-results
          pytest tests/integration/ \
            --reruns 2 --reruns-delay 1 \
            -v -ra \
            --tb=short \
            --alluredir=./allure-results

      - name: Upload Allure results (always)
        if: always() && steps.changes.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          # Always uploaded so passing runs also have a report on hand
          # — useful for trend analysis (run-time creep, flake rate).
          # Operator: download + `allure serve <unzipped-dir>` for HTML.
          name: tier2-allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Post Tier 2 result embed to Discord
        if: always() && steps.changes.outputs.run == '1'
        # Self-hosted runner is on the data server, so /etc/ktp/discord-relay.conf
        # is readable directly — no GH-Actions secrets needed for the relay
        # creds. Helper script reads RELAY_URL + AUTH_SECRET + TIER2_REPORT_CHANNEL
        # (default 1498813261263405097, the scheduled-report channel where
        # perf-rollup + canary embeds also flow). Override via the conf file
        # if you want a dedicated channel for Tier 2 results.
        #
        # Failure here does NOT mask a real test failure — the embed step
        # logs and exits 0 so the workflow's overall result reflects pytest's
        # exit code, not a transient relay issue.
        run: |
          if [ ! -f tier2-report.json ]; then
            echo "tier2-report.json not produced (pytest may have crashed before sessionfinish hook); skip embed"
            exit 0
          fi
          # `|| true` — see comment above. A relay/embed failure is a
          # noise issue, not a test failure.
          python3 scripts/post-tier2-result.py \
            --report tier2-report.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --branch "${{ github.ref }}" \
            --commit-sha "${{ github.sha }}" \
            || echo "WARNING: post-tier2-result.py exited non-zero; embed not posted (test result unaffected)"

      - name: Upload Tier 2 report JSON (always)
        if: always() && steps.changes.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          # Useful for post-mortem analysis even after the embed has been
          # archived in Discord. Same JSON the embed was built from.
          name: tier2-report-${{ github.run_id }}
          path: tier2-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect crash artifacts on failure
        if: failure() && steps.changes.outputs.run == '1'
        run: |
          # If hlds_linux crashed during the run, /tmp will have a core
          # file. Capture it for forensic analysis.
          mkdir -p ci-artifacts
          cp /tmp/core.hlds_linux.* ci-artifacts/ 2>/dev/null || true
          cp "$KTP_HLDS_SERVERFILES"/dod/addons/ktpamx/logs/L*.log ci-artifacts/ 2>/dev/null || true
          cp "$KTP_HLDS_SERVERFILES"/dod/addons/ktpamx/logs/witness.jsonl ci-artifacts/ 2>/dev/null || true
          ls -la ci-artifacts/

      - name: Upload artifacts on failure
        if: failure() && steps.changes.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: tier2-failure-artifacts-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 14

      - name: Record Tier 2 last-run marker (heartbeat input)
        if: always() && steps.changes.outputs.run == '1'
        # scripts/ktp-tier2-heartbeat.sh (data-server cron) reads
        # tier2-last-run.json and alerts to Discord if Tier 2 hasn't run
        # within its window or the last run failed — so a dead self-hosted
        # runner / broken schedule is VISIBLE instead of looking identical to
        # "all green". Written to a runner-writable path next to the
        # serverfiles tree; the cron (root) reads it. Gated on run == '1' so
        # a self-skipped docs-only PR doesn't stamp an empty-outcome marker
        # over the last real run.
        #
        # Only the `main` leg writes the canonical filename the existing
        # heartbeat cron already watches — left untouched so that monitoring
        # doesn't regress. The `preprod` leg writes a second, parallel marker
        # so preprod health is visible too, without the heartbeat script
        # needing to change (it doesn't need to, yet — see
        # docs/handover/PREPROD_BRANCHING.md).
        run: |
          if [ "${{ matrix.target_ref }}" = "preprod" ]; then
            MARKER="$(dirname "$KTP_HLDS_SERVERFILES")/tier2-last-run-preprod.json"
          else
            MARKER="$(dirname "$KTP_HLDS_SERVERFILES")/tier2-last-run.json"
          fi
          printf '{"ts": %s, "outcome": "%s", "run_id": "%s", "event": "%s", "ref": "%s"}\n' \
            "$(date +%s)" "${{ steps.pytest.outcome }}" "${{ github.run_id }}" "${{ github.event_name }}" "${{ matrix.target_ref }}" \
            > "$MARKER"
          echo "Wrote $MARKER ($(cat "$MARKER"))"
