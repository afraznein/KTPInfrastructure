name: Lane B socket probe

# Lane B dies at hlds boot with
#   WARNING: UDP_OpenSocket: port: 27015 socket: Function not implemented
# and KTP-ReHLDS net_ws.cpp:1589 shows the failing call is plain
# socket(PF_INET, SOCK_DGRAM, IPPROTO_UDP). ENOSYS is what docker's default
# seccomp profile returns for a syscall it does not allow, and hlds is 32-bit,
# so the call reaches the kernel either as the i386 `socket` syscall (359) or
# through the `socketcall` multiplexer (102).
#
# Which of the two is refused decides what a narrow profile has to allow, and
# nothing in a Lane B log can say. This probe answers it in one dispatch and
# touches nothing Lane B runs.
#
# The probe is statically linked, so the container needs no 32-bit libraries
# and the answer is about the sandbox rather than about any image's contents.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Environment under test
        run: |
          set -euo pipefail
          echo "kernel      : $(uname -r)"
          echo "docker      : $(docker version -f '{{.Server.Version}}')"
          echo "libseccomp  : $(dpkg-query -W -f='${Version}' libseccomp2 2>/dev/null || echo unknown)"

      - name: Build the 32-bit static probe
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib >/dev/null
          cat > probe.c <<'CEOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <sys/socket.h>
          #include <netinet/in.h>

          /* i386 syscall numbers. Hardcoded on purpose: this binary is -m32, and
             the whole question is which of these two the filter refuses. */
          #define I386_SOCKETCALL 102
          #define I386_SOCKET     359
          #define SYS_SOCKET_OP   1

          static void report(const char *what, long rc) {
              if (rc >= 0) {
                  printf("  %-26s OK (fd=%ld)\n", what, rc);
                  close((int)rc);
              } else {
                  printf("  %-26s FAIL errno=%d (%s)%s\n", what, errno, strerror(errno),
                         errno == ENOSYS ? "   <-- ENOSYS: refused by the filter" : "");
              }
          }

          int main(void) {
              printf("probe: 32-bit, statically linked\n");

              /* 1. what the engine actually calls */
              errno = 0;
              report("glibc socket()", (long)socket(PF_INET, SOCK_DGRAM, IPPROTO_UDP));

              /* 2. the direct i386 socket syscall */
              errno = 0;
              report("syscall(359) socket", syscall(I386_SOCKET, PF_INET, SOCK_DGRAM, IPPROTO_UDP));

              /* 3. the socketcall multiplexer */
              unsigned long a[3] = { PF_INET, SOCK_DGRAM, IPPROTO_UDP };
              errno = 0;
              report("syscall(102) socketcall", syscall(I386_SOCKETCALL, SYS_SOCKET_OP, a));

              /* Control: a syscall every profile allows. If this fails too, the
                 probe is measuring something other than the socket rules. */
              errno = 0;
              report("control getpid()", (long)getpid());
              return 0;
          }
          CEOF
          gcc -m32 -static -O0 -o probe probe.c
          file probe
          test -s probe

      - name: Default seccomp profile (the failing condition)
        run: |
          echo "=== default profile ==="
          docker run --rm --network none -v "${PWD}/probe:/probe:ro" \
            ubuntu:24.04 /probe

      - name: seccomp=unconfined (the control -- all four must pass)
        run: |
          echo "=== unconfined ==="
          docker run --rm --network none --security-opt seccomp=unconfined \
            -v "${PWD}/probe:/probe:ro" ubuntu:24.04 /probe

      - name: Allow-all baseline (is it seccomp at all?)
        run: |
          set -euo pipefail
          # NOT the narrow profile -- that cannot be written until the probe
          # above says WHICH call is refused. This is the third arm: an allow-all
          # filter still goes through seccomp, so if it passes where the default
          # fails, the cause is a profile rule rather than seccomp being present
          # at all, and a narrow profile is therefore possible.
          cat > narrow.json <<'JEOF'
          {
            "defaultAction": "SCMP_ACT_ALLOW",
            "archMap": [
              { "architecture": "SCMP_ARCH_X86_64",
                "subArchitectures": ["SCMP_ARCH_X86", "SCMP_ARCH_X32"] }
            ],
            "syscalls": []
          }
          JEOF
          echo "=== allow-all baseline (isolates 'is it seccomp at all') ==="
          docker run --rm --network none --security-opt seccomp=narrow.json \
            -v "${PWD}/probe:/probe:ro" ubuntu:24.04 /probe
