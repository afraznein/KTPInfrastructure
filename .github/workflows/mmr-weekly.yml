# Weekly MMR update -- proposed GitHub Actions workflow.
#
# NOT INSTALLED YET. This file lives in the MMR artifacts folder; to activate
# it, the MMR code needs a permanent home in a real repo (see
# AUTOMATION_PLAN.md) and this file moves to .github/workflows/mmr-weekly.yml
# there. Installing it is a repo change that needs explicit sign-off.
#
# Runs Monday morning after Sunday-night matches, updates ratings from the
# league's own reported results, commits the new numbers so every week's
# change is diffable in git history, and opens an issue when there is
# something a human should actually look at.
#
# Credentials: only the website publishable/anon key, which is public by
# design (it is inlined in the shipped site bundle). No game-server access,
# no database passwords, no SSH key. That is deliberate -- it is what makes
# this safe to run on a hosted runner.

name: MMR weekly update

on:
  schedule:
    # 14:00 UTC Monday (10am ET) -- after Sunday matches and any result-
    # reporting lag. Cron is UTC; this drifts an hour across DST, which is
    # fine for a weekly job.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      holdout:
        description: "Matches held out for the champion/challenger check"
        required: false
        default: "10"

permissions:
  contents: write   # commit updated ratings + digest
  issues: write     # open the weekly findings issue

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet openskill==6.2.0

      # The methodology document carries a week-by-week accuracy history, and
      # every run starts from a fresh checkout -- so the only copy of the
      # earlier weeks is the payload the last run published. Restore it before
      # the run; run_weekly.py reads its version_history and appends this week.
      # Absent on the first ever run, which is why this never fails the job.
      - name: Restore the previous methodology payload (accuracy history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PRIOR="$RUNNER_TEMP/mmr-prior"
          rm -rf "$PRIOR"
          if ! git clone --quiet --depth 1 --branch mmr-ratings "$REMOTE" "$PRIOR" 2>/dev/null; then
            echo "no mmr-ratings branch yet -- history starts with this run"
            exit 0
          fi
          if [ -f "$PRIOR/rating_methodology_payload.json" ]; then
            cp "$PRIOR/rating_methodology_payload.json" scripts/mmr/
            echo "restored the previous methodology payload"
          else
            echo "mmr-ratings carries no methodology payload yet -- history starts with this run"
          fi

      - name: Run weekly MMR update
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KTP_SUPABASE_PUBLISHABLE_KEY }}
        working-directory: scripts/mmr
        run: python run_weekly.py --use-performance --holdout "${{ github.event.inputs.holdout || '10' }}"

      - name: Upload digest and summary
        uses: actions/upload-artifact@v4
        with:
          name: mmr-weekly-${{ github.run_number }}
          path: |
            scripts/mmr/weekly_digest.md
            scripts/mmr/weekly_summary.json
          if-no-files-found: error

      - name: Open findings issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd scripts/mmr
          HAS_FINDINGS=$(python -c "import json;print(json.load(open('weekly_summary.json'))['has_findings'])")
          HEADLINE=$(python -c "import json;print(json.load(open('weekly_summary.json'))['headline'])")
          if [ "$HAS_FINDINGS" != "True" ]; then
            echo "nothing worth an issue this week: $HEADLINE"
            exit 0
          fi
          gh issue create \
            --title "MMR weekly: $HEADLINE" \
            --body-file weekly_digest.md \
            --label "mmr,automated" \
            --repo "${{ github.repository }}"

      # main is a protected branch: it requires status checks that a bot push
      # can never satisfy, so `git push` there fails with GH006 no matter who
      # holds the token. The first real scheduled run (2026-09-14) died exactly
      # there, after generating its ratings correctly. Rating history is DATA,
      # not source, so it goes to its own unprotected branch and stops trying
      # to walk through a door that is locked by design.
      #
      # Isolated clone rather than switching branches in the workspace: the
      # checkout still holds the run's outputs, and a branch switch underneath
      # them is how you lose a week's work to a stale index.
      - name: Publish ratings to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RATINGS="$GITHUB_WORKSPACE/scripts/mmr/ratings_current.json"
          if [ ! -f "$RATINGS" ]; then
            echo "no ratings produced (no completed matches yet) -- nothing to publish"
            exit 0
          fi
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf mmr-pub
          if git clone --quiet --depth 1 --branch mmr-ratings "$REMOTE" mmr-pub 2>/dev/null; then
            echo "appending to the existing mmr-ratings history"
          else
            echo "mmr-ratings does not exist yet -- creating it"
            mkdir mmr-pub
            cd mmr-pub
            git init -q
            git checkout -q -b mmr-ratings
            git remote add origin "$REMOTE"
            cd "$RUNNER_TEMP"
          fi
          cd mmr-pub
          cp "$RATINGS" ratings_current.json
          # The website-ready payload rides along so the operator step is a
          # fetch plus one command, with no need to rerun the ladder.
          PAYLOAD="$GITHUB_WORKSPACE/scripts/mmr/mmr_openskill_payload.json"
          [ -f "$PAYLOAD" ] && cp "$PAYLOAD" mmr_openskill_payload.json
          # And the methodology document (equations, variables, per-map
          # values) -- same import command, no player rows.
          METHOD="$GITHUB_WORKSPACE/scripts/mmr/rating_methodology_payload.json"
          # The accuracy history only ever grows. The restore step cannot tell a
          # transient clone failure from "mmr-ratings does not exist yet" -- both
          # leave the run with no prior payload -- so without this check a blip
          # up there would overwrite the season's earlier weeks and say nothing.
          # The published copy is already in hand here, so this costs one read.
          if [ -f "$METHOD" ]; then
            python "$GITHUB_WORKSPACE/scripts/mmr/methodology.py" \
              "$METHOD" rating_methodology_payload.json
            cp "$METHOD" rating_methodology_payload.json
          fi
          git add ratings_current.json
          [ -f mmr_openskill_payload.json ] && git add mmr_openskill_payload.json
          [ -f rating_methodology_payload.json ] && git add rating_methodology_payload.json
          if git rev-parse --verify HEAD >/dev/null 2>&1 && git diff --cached --quiet; then
            echo "ratings unchanged this week -- nothing to publish"
            exit 0
          fi
          git -c user.name="ktp-mmr-bot" -c user.email="noreply@github.com"               commit -q -m "MMR ratings $(date -u +%Y-%m-%d)"
          git push --quiet origin mmr-ratings
          echo "published to the mmr-ratings branch"
